# Cloudflare Workers static-assets deployment.
#
#   npx wrangler deploy
#
# This lives at the repository root because that is where Workers Builds looks
# when the git integration runs, and because `name` has to match the connected
# Worker script. The build authenticates the pinned official Web Release ZIP
# and stages its exact public files, plus transport parts, into ./dist.
#
# The small delivery Worker redirects to the pinned Terminal and serves bounded
# object ranges. Linux still runs entirely on the visitor's machine.

name = "libqm-prototype"
main = "data/distribution/cloudflare-web.mjs"
compatibility_date = "2026-08-01"

[build]
# Runs before deploy, locally and in Workers Builds alike, so neither path
# depends on a build command configured outside the repository.
command = "node data/distribution/prepare-cloudflare-web.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
# Missing objects must be a 404, never an HTML shell pretending to be root data.
not_found_handling = "none"

[[routes]]
pattern = "os.length3.com"
custom_domain = true

[[routes]]
pattern = "qm.length3.com"
custom_domain = true
