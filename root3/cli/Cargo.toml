[package]
name = "root3"
version = "0.0.1"
description = "Length³ OS on the command line: the same repos, files, issues and TODO as the app"
edition = "2021"
publish = false

[[bin]]
name = "root3"
path = "src/main.rs"

[features]
default = ["ssh"]
ssh = ["dep:russh", "dep:tokio"]

[dependencies]
length3-core = { path = "../core" }
serde_json = "1"
libc = "0.2"
# SSH into a repo's Prompt (cmd/ssh.rs): a pure-Rust SSH server (Apache-2.0), with
# ring for its cryptography (the core's TLS uses it already) and without RSA:
# Ed25519 and ECDSA keys. Pinned: a server's protocol code moves by hand.
# Left out of the root's own root3 (--no-default-features): a Prompt listens for no one.
russh = { version = "=0.65.0", default-features = false, features = ["ring"], optional = true }
tokio = { version = "1.53", default-features = false, features = ["rt", "net", "time", "process", "io-util", "macros", "signal", "sync"], optional = true }

# The terminal (say/term.rs: its size, its keys one at a time, a key waited for) and an SSH session's (cmd/ssh.rs: its pty, its
# session) through rustix's safe calls; the core has it already.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "event", "fs", "process", "pty", "stdio", "termios"] }
