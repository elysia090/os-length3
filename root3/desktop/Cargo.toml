[package]
name = "root3-desktop"
version = "0.0.1"
description = "Length³ OS native work shell"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
root3-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
