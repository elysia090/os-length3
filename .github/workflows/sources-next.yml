name: Sources, newest

# What every source the root is built from (distribution/sources.env) has as its newest release, with the
# digests to pin it by (distribution/sources-next.py): the table in the run's summary, and sources.env as it would
# be with them as an artifact. Every week, by hand, and when the script changes. Nothing is pushed: a person
# reads the table and moves the file over sources.env.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sources-next.yml', 'distribution/sources-next.py']

permissions:
  contents: read

jobs:
  newest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Newest releases and their digests
        run: |
          python3 distribution/sources-next.py distribution/sources.env sources.next.env | tee table.txt
          { echo '```'; cat table.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo '--- sources.next.env'
          cat sources.next.env
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources-next
          path: |
            sources.next.env
            table.txt
          retention-days: 30
