name: Sources, newest

# What every source the root is built from (root/sources.env) has as its newest release, with the digests to pin
# it by, and every other pin downloaded and checked (root/next.py): the table in the run's summary, the files as
# they would be as an artifact. A pin its maker broke fails the run. And what its Rust and Go programs are made of,
# against the advisories published since (root/advisories.sh): one that reaches a pin fails the run, which is said
# to whoever owns the repository. Every week, by hand, and when the pins or the scripts change. Nothing is pushed: a
# person reads the table and moves the files over.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/sources-next.yml', 'root/next.py', 'root/sources.env', 'root/advisories.sh', 'root/advisories.toml']

permissions:
  contents: read

jobs:
  newest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Newest releases and their digests
        run: |
          set -o pipefail
          python3 root/next.py root/sources.env | tee table.txt
          { echo '```'; cat table.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          for f in *.next; do echo "--- $f"; cat "$f"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources-next
          path: |
            *.next
            table.txt
          retention-days: 30

  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: osv-scanner, from its pinned release (its modules checked against Go's checksum database)
        run: GOTOOLCHAIN=auto go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
      - name: The root's Rust and Go programs, against the advisories published of what they are made of
        run: |
          set -o pipefail
          OSV_FORMAT=markdown sh root/advisories.sh ~/go/bin/osv-scanner | tee -a "$GITHUB_STEP_SUMMARY"
