# Candidate for the already-isolated Everyday diagnostic branch ONLY.
# Do not merge into main, attach a PR, or dispatch without owner acceptance of the derivative.
name: CI
on: workflow_dispatch
permissions:
  contents: read
  actions: read  # same-repository, already existing exact translator artifact only
concurrency:
  group: rx-everyday-shell-${{ github.ref }}
  cancel-in-progress: false
jobs:
  everyday-shell-stock-chrome:
    if: github.repository == 'elysia090/os-length3' && github.event_name == 'workflow_dispatch' && github.actor_id == '148540043' && github.actor == 'elysia090' && github.triggering_actor == 'elysia090' && github.ref == 'refs/heads/diag/everyday-static-28c45a6'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: integration
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: product
          ref: 28c45a65649b1058da0ad5077624e8fd4fa3cee9
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
          package-manager-cache: false
      - name: Verify stock Chrome and native Muk before large downloads
        shell: bash
        run: bash integration/.github/rx-everyday-shell/ci.sh preflight "$GITHUB_WORKSPACE/product"
      - name: Read and verify exact existing public inputs
        shell: bash
        env:
          RX_ARTIFACT_READ_TOKEN: ${{ github.token }}
        run: bash integration/.github/rx-everyday-shell/ci.sh fetch "$GITHUB_WORKSPACE/product"
      - name: Run pinned derivative shell on stock sandboxed Chrome
        shell: bash
        run: bash integration/.github/rx-everyday-shell/ci.sh run "$GITHUB_WORKSPACE/product"
