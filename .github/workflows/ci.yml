name: CI

# The app, the root3 command and its core, the translator and the root. A change is tested once, in its pull request
# (on the merge it would make); a branch without one runs by hand.
on:
  pull_request:
    paths: ['src/**', 'module/**', 'root/**', 'scripts/**', 'tests/**', 'public/**', 'package.json', 'package-lock.json', 'Cargo.toml', 'Cargo.lock', '.cargo/**', 'tsconfig.json', 'wrangler.toml', '.github/workflows/ci.yml']
  workflow_dispatch:

# Read-only token. Actions are pinned to full commits (tag beside); Dependabot proposes updates.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Each job builds once: incremental artifacts only make the cache larger.
  CARGO_INCREMENTAL: '0'
# rust-cache keys hash the workspace's Cargo.toml too: rust-cache hashes members' manifests and the lockfile, not the
# workspace's [profile], so a changed profile would otherwise restore a stale build.

# Jobs run side by side. What several need (the core as wasm, the web root) is built once by its own job, cached
# by its inputs, and built only when they change.
jobs:
  core-wasm:
    name: Core (wasm)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: key
        run: echo "key=core-wasm-${{ hashFiles('src/core/src/**', 'src/core/web/src/**', 'src/core/Cargo.toml', 'src/core/web/Cargo.toml', 'Cargo.toml', 'Cargo.lock', 'src/shared/templates.json', 'scripts/core-wasm.ts') }}" >> "$GITHUB_OUTPUT"
      - id: kept
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/wasm32-wasip1/web/length3_core_web.wasm
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.kept.outputs.cache-hit != 'true'
        run: rustup target add wasm32-wasip1
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          shared-key: core-wasm-${{ hashFiles('Cargo.toml') }}
          cache-on-failure: true
      - name: Build
        if: steps.kept.outputs.cache-hit != 'true'
        run: cargo build --locked --profile web -p length3-core-web --target wasm32-wasip1
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/wasm32-wasip1/web/length3_core_web.wasm
          key: ${{ steps.key.outputs.key }}

  # The pinned root as the browser reads it, built with this tree's translator and checked against the root.
  webroot:
    name: Web root
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: key
        run: echo "key=webroot-${{ hashFiles('root/RELEASE', 'src/core/src/root/pins.rs', 'src/remote/ship/releases.ts', 'scripts/webroot.sh', 'scripts/webroot.ts', 'scripts/webroot-tree.ts', 'scripts/root-file.ts', 'scripts/webroot-parity.ts', 'module/muk/runtime/table.ts', 'module/sods/Cargo.toml', 'module/sods/Cargo.lock', 'module/sods/src/**') }}" >> "$GITHUB_OUTPUT"
      - id: kept
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/webroot
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - if: steps.kept.outputs.cache-hit != 'true'
        run: rustup target add wasm32-unknown-unknown
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: module/sods -> target
          shared-key: webroot-${{ hashFiles('module/sods/Cargo.toml') }}
          cache-on-failure: true
      - name: Build and check
        if: steps.kept.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          root=$(node scripts/root-file.ts target/root)
          sh scripts/webroot.sh "$root" public/webroot
          node scripts/webroot-parity.ts "$root" public/webroot
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/webroot
          key: ${{ steps.key.outputs.key }}

  # Every command of issue #80 run under xlat and natively in the pinned root; the table `help` reads
  # (root/etc/length3/commands) checked against the results.
  commands:
    name: Commands
    needs: webroot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Restore web root
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/webroot
          key: ${{ needs.webroot.outputs.key }}
          fail-on-cache-miss: true
      # bwrap needs user namespaces, which Ubuntu's AppArmor restricts by default.
      - name: Install bubblewrap
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Check the command table
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          root=$(node scripts/root-file.ts target/root)
          mkdir -p target/root-open && tar --zstd -xf "$root" -C target/root-open
          node scripts/commands.ts public/webroot target/root-open/root --jobs 4 --check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  # npm test in four shards: node gives each every fourth test file.
  unit:
    name: Unit (${{ matrix.shard }}/4)
    needs: core-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Restore core (wasm)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/wasm32-wasip1/web/length3_core_web.wasm
          key: ${{ needs.core-wasm.outputs.key }}
          fail-on-cache-miss: true
      # Newer than the checkout, so scripts/core-wasm.ts (which goes by mtime) does not rebuild it.
      - run: touch target/wasm32-wasip1/web/length3_core_web.wasm
      - run: npm ci
      - name: Test
        env:
          NODE_OPTIONS: --test-shard=${{ matrix.shard }}/4
        run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          shared-key: lint-${{ hashFiles('Cargo.toml') }}
          cache-on-failure: true
      # The desktop crate needs GTK and is linted where it is built (desktop job).
      - name: Clippy
        run: cargo clippy --locked --all-targets -p length3-core -p length3-core-web -p root3 -- -D warnings
      - name: Clippy (wasm32-wasip1)
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p length3-core -p length3-core-web --target wasm32-wasip1 -- -D warnings

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # root3 prompt makes user namespaces, which this image's AppArmor restricts.
      - name: Allow user namespaces
        run: if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          shared-key: rust-${{ hashFiles('Cargo.toml') }}
          cache-on-failure: true
      - name: Test core and CLI
        run: cargo test --locked -p length3-core -p root3
      - name: Test CLI end to end
        if: ${{ !cancelled() }}
        run: |
          npm ci
          npm run selftest:cli

  # The x86-64 → wasm translator against native; and root3 (static, musl) run under it as the browser runs it.
  xlat:
    name: xlat (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [native, prompt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            module/sods -> target
            . -> target
          shared-key: xlat-${{ matrix.part }}-${{ hashFiles('module/sods/Cargo.toml', 'Cargo.toml') }}
          cache-on-failure: true
      - name: Test against native
        if: matrix.part == 'native'
        working-directory: module/ricebox
        run: sh tests/programs/run.sh
      # run.ts takes the wasm build of the translator when it is current.
      - name: Run root3 under xlat
        if: matrix.part == 'prompt'
        run: |
          cargo build -q --locked --release --target wasm32-unknown-unknown --lib --manifest-path module/sods/Cargo.toml
          cargo build --locked --profile prompt -p root3 --no-default-features --target x86_64-unknown-linux-musl
          out=$(LENGTH3_REPOS=/root node module/ricebox/runtime/run.ts target/x86_64-unknown-linux-musl/prompt/root3 help all)
          echo "$out" | head -3
          echo "$out" | grep -q 'root3 issue new'

  # The desktop app built and bundled on macOS, Windows and Linux on Arm, root3 beside it (as scripts/desktop.sh
  # does on Linux x86-64). Prompts there run translated.
  desktop:
    name: Desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: aarch64-apple-darwin, bundles: app}
          - {os: macos-15-intel, target: x86_64-apple-darwin, bundles: app}
          - {os: windows-2025, target: x86_64-pc-windows-msvc, bundles: nsis}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, bundles: deb}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install webview
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}-${{ hashFiles('Cargo.toml') }}
      - name: Build and bundle
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          npm ci
          # root3 is built for the app's minimum macOS (bundle.macOS.minimumSystemVersion, 10.13 by default), so what
          # both build (ring's C) is built once.
          if [ "$RUNNER_OS" = macOS ]; then
            export MACOSX_DEPLOYMENT_TARGET=$(node -p "require('./src/desktop/tauri.conf.json').bundle?.macOS?.minimumSystemVersion ?? '10.13'")
          fi
          cargo build --locked --release -p root3
          ext=; [ "$RUNNER_OS" = Windows ] && ext=.exe
          mkdir -p src/desktop/binaries
          cp "target/release/root3$ext" "src/desktop/binaries/root3-$TARGET$ext"
          "target/release/root3$ext" root check
          npx tauri build --bundles "$BUNDLES" --config '{"build": {"beforeBuildCommand": "npx vite build --config src/app/vite.config.ts"}, "bundle": {"externalBin": ["binaries/root3"]}}'

  # The .deb's AppArmor profile (src/desktop/deb) on stock Ubuntu 24.04: /usr/bin/root3 can make user namespaces
  # after postinst installs it, and cannot after postrm removes it.
  apparmor:
    name: AppArmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          shared-key: rust-${{ hashFiles('Cargo.toml') }}
      - name: Check the profile
        run: |
          [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]
          cargo build -q --locked -p root3
          sudo install -m 0755 target/debug/root3 /usr/bin/root3
          native() { /usr/bin/root3 root check --json | node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(0, "utf8")).native))'; }
          [ "$(native)" = false ] || { echo "user namespaces were not kept from /usr/bin/root3 to begin with" >&2; exit 1; }
          /usr/bin/root3 root check
          sudo install -D -m 0644 src/desktop/deb/length3-root3.apparmor /usr/share/length3-os/apparmor/length3-root3
          sudo sh src/desktop/deb/postinst configure
          [ "$(native)" = true ] || { /usr/bin/root3 root check; exit 1; }
          sudo sh src/desktop/deb/postrm remove
          [ ! -e /etc/apparmor.d/length3-root3 ]
          [ "$(native)" = false ] || { echo "the profile stayed after postrm" >&2; exit 1; }

  # The root as a release builds it (root/make/build.sh, root/make/assemble.sh), then used inside as a Prompt uses it and
  # under xlat. Runs only when what the root is made of changed.
  root:
    name: Root
    runs-on: ubuntu-24.04
    # A cold build (GCC above all) takes most of an hour; later runs rebuild only what a raised pin touches.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: key
        run: echo "key=root-${{ hashFiles('root/**', 'module/you/**', 'module/otter/**', 'module/lib/**', '.github/actions/root-packages/**') }}" >> "$GITHUB_OUTPUT"
      - id: kept
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/root-made/manifest
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install toolchains
        if: steps.kept.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools bubblewrap
          rustup target add x86_64-unknown-linux-musl wasm32-unknown-unknown
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            module/sods -> target
            . -> target
          shared-key: root-${{ hashFiles('module/sods/Cargo.toml', 'Cargo.toml') }}
          cache-on-failure: true
      # After rust-cache: restoring a cache from another lockfile cleans all of target/, packages included.
      - name: Build packages
        if: steps.kept.outputs.cache-hit != 'true'
        uses: ./.github/actions/root-packages
      - name: Assemble and check
        if: steps.kept.outputs.cache-hit != 'true'
        run: |
          sh root/make/assemble.sh target/root-packages target/root-made 0.0.0
          mkdir -p target/root-open
          # Owned by root, as in a Prompt: apk will not audit a database another user owns.
          sudo tar --zstd -xf target/root-made/os-length3-linux-0.0.0-x86_64-*.tar.zst -C target/root-open
          r=$PWD/target/root-open/root
          . root/pins/sources.env
          # Inside the root as a Prompt runs it: read-only, work in its /tmp.
          w=$RUNNER_TEMP/w
          mkdir -p "$w"
          inside() { sudo bwrap --ro-bind "$r" / --dev /dev --proc /proc --bind "$w" /tmp --chdir /tmp /bin/sh -c "$1"; }
          # says CMD WANT: fails, printing both, unless CMD prints WANT.
          says() { got=$(eval "$1" 2>&1 < /dev/null) || true; [ "$got" = "$2" ] || { printf 'asked: %s\nsaid:  %s\nnot:   %s\n' "$1" "$got" "$2" >&2; return 1; }; }
          # gcc parses floating literals correctly, built through make.
          printf '%s\n' '#include <stdio.h>' 'int main(void) { double f[] = {6.5, 7.3}; printf("%.17g %.17g %d\n", f[0], f[1], (int)(7.3 * 12)); return 0; }' > "$w/literals.c"
          printf 'literals: literals.c\n\tcc -O1 -o $@ literals.c\n' > "$w/Makefile"
          said=$(inside 'make -s literals && ./literals')
          [ "$said" = '6.5 7.2999999999999998 87' ] || { echo "the root's gcc compiles literals wrong: $said" >&2; exit 1; }
          # apk lists every package assembled, and every file audits clean.
          inside 'apk info' | sort > "$w/apk-info"
          { cut -d' ' -f1 target/root-packages/record; echo root3; } | sort | diff - "$w/apk-info"
          audit=$(inside 'apk audit --system 2>&1' || true)
          [ -z "$audit" ] || { echo "apk audit says:" >&2; echo "$audit" >&2; exit 1; }
          inside 'openssl version' | grep -F "OpenSSL $OPENSSL_VERSION "
          inside 'curl --version' | grep -F "curl $CURL_VERSION "
          inside 'ssh -V 2>&1' | grep -F "OpenSSH_$OPENSSH_VERSION"
          inside 'git --version' | grep -F "git version $GIT_VERSION"
          # Non-ASCII names, and git init on main.
          says "inside 'touch 日本語.txt && ls 日本語.txt'" 日本語.txt
          says "inside 'git init -q r && git -C r symbolic-ref HEAD'" refs/heads/main
          # rg and fd honour .gitignore; fzf filters; yq reads YAML; tldr speaks Japanese; git pages through delta.
          mkdir -p "$w/p/.git" "$w/p/src" "$w/p/build" "$w/home"
          echo build > "$w/p/.gitignore"; echo needle > "$w/p/src/a.ts"; echo needle > "$w/p/build/b.ts"
          says "inside 'cd p && rg -l needle'" src/a.ts
          says "inside 'cd p && fd -e ts'" src/a.ts
          says "inside 'printf \"lib/x.c\\nweb/src/main.ts\\n\" | fzf --filter main'" web/src/main.ts
          says "inside 'echo \"a: {b: 1}\" | yq .a.b'" 1
          says "inside 'LANG=C.UTF-8 LANGUAGE=ja TEALDEER_CONFIG_DIR=/etc/tealdeer tldr --raw tar' | grep -q 'アーカイブ' && echo in Japanese" 'in Japanese'
          says "inside 'git config --system core.pager'" delta
          # sleep is a program, not a builtin a shell's exit would cut short.
          says "inside 'type sleep'" 'sleep is /usr/bin/sleep'
          # The Prompt's shell: z jumps by part of a name; an allowed .envrc sets the environment.
          echo 'export MADE=here' > "$w/p/src/.envrc"
          prompt() { inside "HOME=/tmp/home XDG_DATA_HOME=/tmp/home/share XDG_STATE_HOME=/tmp/home/state TERM=dumb ENV=/etc/length3/shrc sh -ic '$1' 2>/dev/null"; }
          # (z learns from cd; z DIR enters it; z - goes back.)
          says "prompt 'cd /tmp/p/src && cd / && z src && pwd'" /tmp/p/src
          says "prompt 'cd /tmp/p && z src && z - && pwd'" /tmp/p
          says "prompt 'cd /tmp/p/src && direnv allow . && echo \$MADE'" here
          # clear sends the clear sequence even on a dumb terminal (ncurses' clear prints nothing there).
          says "prompt clear | od -An -c | tr -d ' \\n'" '033[H033[2J'
          # The same programs under xlat.
          cargo build -q --locked --release --target wasm32-unknown-unknown --lib --manifest-path module/sods/Cargo.toml
          node module/ricebox/runtime/run.ts "$r/usr/bin/git" --version | grep -F "git version $GIT_VERSION"
          node module/ricebox/runtime/run.ts "$r/usr/bin/openssl" version | grep -F "OpenSSL $OPENSSL_VERSION "
          node module/ricebox/runtime/run.ts "$r/usr/bin/busybox" sh -c 'echo $((6 * 7))' | grep -x 42
          node module/ricebox/runtime/run.ts "$r/usr/bin/rg" --version | grep -F "ripgrep $RIPGREP_VERSION"
          printf 'lib/x.c\nweb/src/main.ts\n' | node module/ricebox/runtime/run.ts "$r/usr/bin/fzf" --filter main | grep -x web/src/main.ts
          sudo rm -rf target/root-open
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/root-made/manifest
          key: ${{ steps.key.outputs.key }}

  # No known high or critical advisory in what ships: npm (dev dependencies left out), RustSec for both lockfiles
  # (unmaintained or unsound crates in the desktop's GTK tree are reported, not failed on), and the root's Rust
  # and Go programs.
  audit:
    name: Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm audit
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
      # cargo-audit takes five minutes to build: cached.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: audit
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - if: ${{ !cancelled() && steps.audit.outputs.cache-hit != 'true' }}
        run: cargo install --locked cargo-audit@0.22.2
      - if: ${{ !cancelled() && steps.audit.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - name: cargo audit
        if: ${{ !cancelled() }}
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file module/sods/Cargo.lock
      # osv-scanner from its pinned release (modules checked against Go's checksum database), cached.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: osv
        with:
          path: ~/go/bin/osv-scanner
          key: osv-scanner-2.7.0-${{ runner.os }}
      - if: ${{ !cancelled() && steps.osv.outputs.cache-hit != 'true' }}
        run: GOTOOLCHAIN=auto go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
      - if: ${{ !cancelled() && steps.osv.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/osv-scanner
          key: osv-scanner-2.7.0-${{ runner.os }}
      - name: Scan the root's programs
        if: ${{ !cancelled() }}
        run: sh root/make/advisories.sh ~/go/bin/osv-scanner

  # The app end to end in Chromium, in four shards, each with its own Remote and its own build of the app.
  selftest:
    name: Selftest (${{ matrix.shard }}/4)
    needs: [core-wasm, webroot]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      # The image has Chromium's system dependencies; only the browser is fetched.
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Restore core (wasm)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/wasm32-wasip1/web/length3_core_web.wasm
          key: ${{ needs.core-wasm.outputs.key }}
          fail-on-cache-miss: true
      # Newer than the checkout, so scripts/core-wasm.ts (which goes by mtime) does not rebuild it.
      - run: touch target/wasm32-wasip1/web/length3_core_web.wasm
      - name: Restore web root
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/webroot
          key: ${{ needs.webroot.outputs.key }}
          fail-on-cache-miss: true
      - name: Test
        env:
          SELFTEST_SLOW: '1'
        run: npm run selftest -- --shard=${{ matrix.shard }}/4
      - name: Upload report, traces and server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftest-${{ matrix.shard }}
          path: |
            tests/app/.report
            tests/app/.results
            tests/app/.logs
          retention-days: 14
          include-hidden-files: true
      # Passed only on a retry: the failed attempt's trace.
      - name: Upload flaky traces
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftest-flaky-${{ matrix.shard }}
          path: tests/app/.results
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
