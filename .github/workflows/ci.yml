name: CI

# The app, the why command and its core, the translator and the root. A change is tested once, in its pull request
# (on the merge it would make); a branch without one runs by hand.
on:
  pull_request:
    paths: ['why/**', 'ricebox/**', 'scripts/**', 'package.json', 'package-lock.json', 'Cargo.toml', 'Cargo.lock', '.cargo/**', 'tsconfig.json', 'wrangler.toml', '.github/workflows/ci.yml']
  workflow_dispatch:
    inputs:
      everyday_chrome:
        description: Run the isolated guest Wayland/Chrome conformance gate
        type: boolean
        default: false

# Read-only token. Actions are pinned to full commits (tag beside); Dependabot proposes updates.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Each job builds once: incremental artifacts only make the cache larger.
  CARGO_INCREMENTAL: '0'
# rust-cache keys hash the workspace's Cargo.toml too: rust-cache hashes members' manifests and the lockfile, not the
# workspace's [profile], so a changed profile would otherwise restore a stale build.

# Jobs run side by side. What several need (the core as wasm, the web root) is built once by its own job, cached
# by its inputs, and built only when they change.
jobs:
  core-wasm:
    name: Core (wasm)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: key
        env:
          INPUT_HASH: >-
            ${{ hashFiles('Cargo.toml', 'Cargo.lock', '.cargo/config.toml',
            'why/**/*.rs', 'why/Cargo.toml', 'why/api/web/Cargo.toml',
            'why/repo/templates.json', 'why/build/core-wasm.ts',
            'ricebox/distribution/src/**', 'ricebox/distribution/Cargo.toml',
            'ricebox/distribution/build.rs') }}
        run: echo "key=core-wasm-$INPUT_HASH" >> "$GITHUB_OUTPUT"
      - id: kept
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/wasm32-wasip1/web/why_core_web.wasm
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.kept.outputs.cache-hit != 'true'
        run: rustup target add wasm32-wasip1
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          shared-key: core-wasm-${{ hashFiles('Cargo.toml') }}
          cache-on-failure: true
      - name: Build
        if: steps.kept.outputs.cache-hit != 'true'
        run: cargo build --locked --profile web -p why-core-web --target wasm32-wasip1
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/wasm32-wasip1/web/why_core_web.wasm
          key: ${{ steps.key.outputs.key }}

  # The pinned root as the browser reads it, built with this tree's translator and checked against the root.
  webroot:
    name: Web root
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: key
        env:
          INPUT_HASH: >-
            ${{ hashFiles('.cargo/config.toml',
            'why/prompt/roots/pins.rs', 'why/shipto/release-pins.ts',
            'why/shipto/desktop-releases.json', 'why/build/fetch-root.ts',
            'why/build/webroot.sh', 'why/LEGACY_RELEASE',
            'ricebox/distribution/build/**', 'ricebox/distribution/format/**',
            'ricebox/distribution/host/node/**', 'ricebox/distribution/deployment/**',
            'ricebox/distribution/verification/distribution.ts',
            'ricebox/distribution/verification/inventory.ts',
            'ricebox/sods/Cargo.toml', 'ricebox/sods/Cargo.lock', 'ricebox/sods/src/**',
            'ricebox/sods/runtime/translation/share.ts', 'ricebox/muk/src/**',
            'ricebox/toolchain/build.sh', 'ricebox/toolchain/*.h') }}
        run: echo "key=webroot-$INPUT_HASH" >> "$GITHUB_OUTPUT"
      - id: kept
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: why/app/public/webroot
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - if: steps.kept.outputs.cache-hit != 'true'
        run: rustup target add wasm32-unknown-unknown
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ricebox/sods -> target
          shared-key: webroot-${{ hashFiles('ricebox/sods/Cargo.toml') }}
          cache-on-failure: true
      - name: Build and check
        if: steps.kept.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          root=$(node why/build/fetch-root.ts target/root)
          sh why/build/webroot.sh "$root" why/app/public/webroot
          node ricebox/distribution/verification/distribution.ts "$root" why/app/public/webroot
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: why/app/public/webroot
          key: ${{ steps.key.outputs.key }}

  # Every command of issue #80 run under muk and natively in the pinned root; the table `help` reads
  # (ricebox/distribution/etc/length3/commands) checked against the results.
  commands:
    name: Commands
    needs: webroot
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Restore web root
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: why/app/public/webroot
          key: ${{ needs.webroot.outputs.key }}
          fail-on-cache-miss: true
      - name: Run the release shell with the shipped Muk
        env:
          RICEBOX_RELEASE_DIR: why/app/public/webroot
        run: node --test ricebox/distribution/verification/test/release-shell.integration.ts
      - name: Test Sods with the BusyBox shipped in the web root
        env:
          SODS_TEST_USERLAND_DIR: target/sods-release-fixture
        run: |
          node ricebox/distribution/verification/test/fixtures/stage-sods-userland.ts why/app/public/webroot "$SODS_TEST_USERLAND_DIR"
          node --test --test-concurrency=3 ricebox/sods/test/runtime/{interrupt,kept,notprogram,proc,remote,tty,waiting}.test.ts
      # Each line's box is made by muk on both sides (ricebox/distribution/verification/programs.ts), natively in a user namespace
      # of the runner's own, which Ubuntu's AppArmor restricts by default.
      - name: Allow user namespaces
        run: if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - name: Check the installed Ricebox root with one native pathname socket
        run: cargo run --locked -p ricebox --example native-socket-proof -- target/sods-release-fixture/busybox
      - name: Check the command table
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          root=$(node why/build/fetch-root.ts target/root)
          mkdir -p target/root-open && tar --zstd -xf "$root" -C target/root-open
          node ricebox/distribution/verification/commands.ts why/app/public/webroot target/root-open/root --jobs 4 --check

  # cowboy: its Rust by itself (names answered on the device, the way to an address, a relay's one line), then as
  # wasm with a real program: the pinned root's curl on sods' Linux in node, asking a name and reaching a server by it.
  cowboy:
    name: cowboy
    needs: webroot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Restore web root
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: why/app/public/webroot
          key: ${{ needs.webroot.outputs.key }}
          fail-on-cache-miss: true
      - name: Its Rust, by itself
        run: |
          rustup target add wasm32-unknown-unknown
          cargo test --locked --manifest-path ricebox/cowboy/Cargo.toml
          cargo clippy --locked --manifest-path ricebox/cowboy/Cargo.toml --all-targets -- -D warnings
          cargo build --locked --release --manifest-path ricebox/cowboy/Cargo.toml --target wasm32-unknown-unknown
      - name: A program of the root reaches a host by its name
        run: |
          npm ci
          node --test ricebox/cowboy/test/*.test.ts

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  # npm test in four shards: node gives each every fourth test file.
  unit:
    name: Unit (${{ matrix.shard }}/4)
    needs: core-wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Restore core (wasm)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/wasm32-wasip1/web/why_core_web.wasm
          key: ${{ needs.core-wasm.outputs.key }}
          fail-on-cache-miss: true
      # Newer than the checkout, so why/build/core-wasm.ts (which goes by mtime) does not rebuild it.
      - run: touch target/wasm32-wasip1/web/why_core_web.wasm
      - run: npm ci
      - name: Test
        env:
          NODE_OPTIONS: --test-shard=${{ matrix.shard }}/4
        run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          shared-key: lint-${{ hashFiles('Cargo.toml') }}
          cache-on-failure: true
      # The desktop crate needs GTK and is linted where it is built (desktop job).
      - name: Clippy
        run: cargo clippy --locked --all-targets -p ricebox -p why-core -p why-core-web -p why -- -D warnings
      - name: Clippy (wasm32-wasip1)
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p why-core -p why-core-web --target wasm32-wasip1 -- -D warnings

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # why prompt makes user namespaces, which this image's AppArmor restricts.
      - name: Allow user namespaces
        run: if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          shared-key: rust-${{ hashFiles('Cargo.toml') }}
          cache-on-failure: true
      - name: Test core and CLI
        run: cargo test --locked -p ricebox -p why-core -p why
      - name: Test CLI end to end
        if: ${{ !cancelled() }}
        run: |
          npm ci
          npm run selftest:cli

  # The x86-64 → wasm translator against native; and why (static, musl) run under it as the browser runs it.
  browser:
    name: sods Linux runtime (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [native, prompt, muk]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools busybox-static
          if [ "${{ matrix.part }}" = native ]; then
            sudo apt-get install -y --no-install-recommends libexpat1-dev pkg-config
          fi
          rustup target add x86_64-unknown-linux-musl wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            ricebox/sods -> target
            . -> target
          shared-key: sods-${{ matrix.part }}-${{ hashFiles('ricebox/sods/Cargo.toml', 'Cargo.toml') }}
          cache-on-failure: true
      - name: Test against native
        if: matrix.part == 'native'
        working-directory: ricebox/sods
        run: sh test/programs/run.sh
      # Preserve the exact translator already built above for isolated runtime regressions.
      # This is a diagnostic artifact, not a release or a cache of arbitrary build outputs.
      - name: Record current-source translator identity
        if: matrix.part == 'native'
        working-directory: ricebox/sods/target/wasm32-unknown-unknown/release
        run: |
          git rev-parse HEAD > source-revision.txt
          sha256sum sods.wasm > SHA256SUMS
      - name: Upload current-source translator
        if: matrix.part == 'native'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sods-translator-current-source
          path: |
            ricebox/sods/target/wasm32-unknown-unknown/release/sods.wasm
            ricebox/sods/target/wasm32-unknown-unknown/release/source-revision.txt
            ricebox/sods/target/wasm32-unknown-unknown/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      # The translator's own tests: among them every opcode scanned as the decoder decodes it; a translation's
      # identity, and the cache that keeps translations under it.
      - name: Test sods
        if: matrix.part == 'native'
        run: cargo test --locked --release --manifest-path ricebox/sods/Cargo.toml
      - name: Test the Sods runtime with current translators
        if: matrix.part == 'native'
        env:
          SODS_CURRENT_TRANSLATOR_WASM: ricebox/sods/target/wasm32-unknown-unknown/release/sods.wasm
          SODS_TRANSLATOR_WASM: ricebox/sods/target/wasm32-unknown-unknown/release/sods.wasm
          SODS_NATIVE: ricebox/sods/target/release/sods
        run: node --test --test-concurrency=3 ricebox/sods/test/runtime/*.test.ts
      # Verify the distribution against the translator binaries this job just built.
      - name: Test Ricebox with real Sods and Muk
        if: matrix.part == 'native'
        env:
          SODS_TRANSLATOR_WASM: ricebox/sods/target/wasm32-unknown-unknown/release/sods.wasm
          SODS_NATIVE: ricebox/sods/target/release/sods
          RICEBOX_AOT_ELF: ricebox/sods/test/programs/out/hello
          RICEBOX_MUK_FILE: target/muk/muk
        run: |
          mkdir -p target/muk
          sh ricebox/toolchain/build.sh ricebox/muk/src/muk.c "$RICEBOX_MUK_FILE"
          node --test ricebox/distribution/runtime/test/*.test.ts ricebox/distribution/build/test/native-association.integration.ts
      - name: Test the Muk parser and Otter catalog composition
        if: matrix.part == 'native'
        run: |
          node --test ricebox/muk/test/*.test.ts ricebox/otter/catalog/*.test.ts
          sh ricebox/muk/test/same.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.part == 'native'
        with:
          node-version: 24
      - name: Test the standalone Sods package on its supported Node version
        if: matrix.part == 'native'
        env:
          SODS_TRANSLATOR_WASM: ricebox/sods/target/wasm32-unknown-unknown/release/sods.wasm
        run: node --test ricebox/sods/package/npm.test.ts
      # Pin and check only the sources used by the native Wayland test fixture;
      # none of this test SDK is selected for a Ricebox release or served.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.part == 'native'
        with:
          repository: wayland-mirror/wayland
          ref: 3e673a438b0a9749e3bdf5cac4befac86333024c # 1.25.0
          path: target/everyday-source/wayland
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.part == 'native'
        with:
          repository: wayland-mirror/wayland-protocols
          ref: 02e63e74a807afed95bc25a386173110afef24e3 # 1.48
          path: target/everyday-source/wayland-protocols
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.part == 'native'
        with:
          repository: libffi/libffi
          ref: e2eda0cf72a0598b44278cc91860ea402273fa29 # 3.5.2
          path: target/everyday-source/libffi
          persist-credentials: false
      - name: Test real guest Wayland commits and mirrored pixels
        if: matrix.part == 'native'
        env:
          SODS_TRANSLATOR_WASM: ricebox/sods/target/wasm32-unknown-unknown/release/sods.wasm
          RICEBOX_MUK_FILE: target/muk/muk
        run: |
          test_dir=ricebox/everyday/test/wayland
          build=target/everyday-fixture
          sh "$test_dir/build.sh" scanner target/everyday-source "$build"
          sh "$test_dir/build.sh" guest target/everyday-source "$build"
          timeout --kill-after=2s 23s python3 "$test_dir/native-check.py" "$build/wayland-presenter"
          timeout --kill-after=2s 23s node "$test_dir/guest.integration.mjs" "$build/wayland-presenter" inline
          timeout --kill-after=2s 23s node "$test_dir/guest.integration.mjs" "$build/wayland-presenter" worker
          # Repeat with a separately executed guest client, not a host display path.
          timeout --kill-after=2s 23s python3 "$test_dir/native-check.py" "$build/wayland-presenter" "$build/wayland-socket-client"
          timeout --kill-after=2s 23s node "$test_dir/guest.integration.mjs" "$build/wayland-presenter" inline "$build/wayland-socket-client"
          timeout --kill-after=2s 23s node "$test_dir/guest.integration.mjs" "$build/wayland-presenter" worker "$build/wayland-socket-client"

      # This opt-in gate consumes the fixture already built above. There is no
      # binary, screenshot or app upload, and Chromium uses its own sandbox.
      - name: Install locked browser test dependencies for Everyday
        if: matrix.part == 'native' && inputs.everyday_chrome == true
        run: npm ci
      - name: Test guest Wayland commits in the runner's stock Chrome
        if: matrix.part == 'native' && inputs.everyday_chrome == true
        env:
          SODS_TRANSLATOR_WASM: ricebox/sods/target/wasm32-unknown-unknown/release/sods.wasm
          RICEBOX_MUK_FILE: target/muk/muk
          EVERYDAY_CHROME_BIN: /opt/google/chrome/chrome
        run: |
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          if ! package=$(dpkg-query -W -f='${Status} ${Version}' google-chrome-stable) ||
             [[ "$package" != "install ok installed "* ]] || [[ ! -x "$EVERYDAY_CHROME_BIN" ]]; then
            echo "::error::Stock Google Chrome stable is not installed at $EVERYDAY_CHROME_BIN on this image"
            exit 1
          fi
          if [[ "$(dpkg-query -S "$EVERYDAY_CHROME_BIN")" != "google-chrome-stable: $EVERYDAY_CHROME_BIN" ]]; then
            echo "::error::The runner's Chrome executable is not owned by google-chrome-stable"
            exit 1
          fi
          echo "Stock Chrome package: $package"
          "$EVERYDAY_CHROME_BIN" --version
          node ricebox/everyday/test/wayland/browser/stock-chrome.ts
          if ! busybox=$(command -v busybox) || [[ ! -x "$busybox" ]]; then
            echo "::error::The explicitly opted-in Chrome composition needs the native lane's static BusyBox"
            exit 1
          fi
          EVERYDAY_SHELL_ELF="$busybox" \
            sh ricebox/everyday/test/wayland/browser/run.sh target/everyday-fixture/wayland-presenter

      # The one muk on every host: muk's own corpus (ricebox/muk/test/muk.sh, hostile.sh) run whole inside sods, the
      # same C muk translated, each box made by the calls it makes on Linux (a static busybox its shell and tools).
      - name: muk's own corpus, with muk on sods' Linux
        if: matrix.part == 'muk'
        run: sh ricebox/sods/test/muk/run.sh "$(command -v busybox)"
      # And the one prompt: prompt's own check of it at two terminals, the terminals sods' Linux's.
      - name: prompt, at a terminal, on sods' Linux
        if: matrix.part == 'muk'
        run: sh ricebox/sods/test/prompt/run.sh

      - name: Run why under muk
        if: matrix.part == 'prompt'
        run: |
          cargo build -q --locked --release --target wasm32-unknown-unknown --lib --manifest-path ricebox/sods/Cargo.toml
          cargo build --locked --profile prompt -p why --no-default-features --target x86_64-unknown-linux-musl
          out=$(WHY_REPOS=/root node ricebox/sods/runtime/run.ts target/x86_64-unknown-linux-musl/prompt/why help all)
          echo "$out" | head -3
          echo "$out" | grep -q 'why issue new'

  # The desktop app built and bundled on macOS, Windows and Linux on Arm, why beside it (as why/build/desktop.sh
  # does on Linux x86-64). Prompts there run translated.
  desktop:
    name: Desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: aarch64-apple-darwin, bundles: app}
          - {os: macos-15-intel, target: x86_64-apple-darwin, bundles: app}
          - {os: windows-2025, target: x86_64-pc-windows-msvc, bundles: nsis}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, bundles: deb}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install webview
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}-${{ hashFiles('Cargo.toml') }}
      - name: Build and bundle
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          npm ci
          # why is built for the app's minimum macOS (bundle.macOS.minimumSystemVersion, 10.13 by default), so what
          # both build (ring's C) is built once.
          if [ "$RUNNER_OS" = macOS ]; then
            export MACOSX_DEPLOYMENT_TARGET=$(node -p "require('./why/desktop/tauri.conf.json').bundle?.macOS?.minimumSystemVersion ?? '10.13'")
          fi
          cargo build --locked --release -p why
          ext=; [ "$RUNNER_OS" = Windows ] && ext=.exe
          mkdir -p why/desktop/binaries
          cp "target/release/why$ext" "why/desktop/binaries/why-$TARGET$ext"
          "target/release/why$ext" root check
          npx tauri build --bundles "$BUNDLES" --config '{"build": {"beforeBuildCommand": "npx vite build --config why/app/vite.config.ts"}, "bundle": {"externalBin": ["binaries/why"]}}'

  # The .deb's AppArmor profile (why/desktop/deb) on stock Ubuntu 24.04: /usr/bin/muk, beside /usr/bin/why, can make
  # user namespaces after postinst installs it, and cannot after postrm removes it.
  apparmor:
    name: AppArmor
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: . -> target
          shared-key: rust-${{ hashFiles('Cargo.toml') }}
      - name: Check the profile
        run: |
          [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]
          cargo build -q --locked -p why
          sudo install -m 0755 target/debug/why /usr/bin/why
          sh ricebox/toolchain/build.sh ricebox/muk/src/muk.c "$RUNNER_TEMP/muk"
          sudo install -m 0755 "$RUNNER_TEMP/muk" /usr/bin/muk
          native() { /usr/bin/why root check --json | node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(0, "utf8")).native))'; }
          [ "$(native)" = false ] || { echo "user namespaces were not kept from /usr/bin/muk to begin with" >&2; exit 1; }
          /usr/bin/why root check
          sudo install -D -m 0644 why/desktop/deb/why.apparmor /usr/share/why/apparmor/why
          sudo sh why/desktop/deb/postinst configure
          [ "$(native)" = true ] || { /usr/bin/why root check; exit 1; }
          sudo sh why/desktop/deb/postrm remove
          [ ! -e /etc/apparmor.d/why ]
          [ "$(native)" = false ] || { echo "the profile stayed after postrm" >&2; exit 1; }

  # muk beside runc: the same bundles run by both, as root (where one who is not may make no user namespace), and what
  # each box says of itself the same (ricebox/muk/test/muk.sh); then a config.json written against muk, every
  # way it has of asking for what is the host's (ricebox/muk/test/hostile.sh).
  muk:
    name: muk
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The bundles, beside runc
        run: |
          runc --version || echo "no runc here: the boxes are run, and not compared"
          sudo sh ricebox/muk/test/muk.sh
      - name: A config.json written against it
        run: sudo sh ricebox/muk/test/hostile.sh
      - name: Profiler ownership tests
        run: python3 ricebox/muk/tool/profile.test.py
      - name: prompt, at a terminal
        run: sh ricebox/distribution/terminal/test/prompt.sh

  # The root as a release builds it (ricebox/distribution/build/packages.sh, ricebox/distribution/build/assemble.sh), then used inside as a Prompt uses it and
  # under muk. Runs only when what the root is made of changed (what makes its layers, beside those in make/, is not).
  root:
    name: Root
    runs-on: ubuntu-24.04
    # A cold build (GCC above all) takes most of an hour; later runs rebuild only what a raised pin touches.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source download fallback and digest checks
        run: sh ricebox/distribution/build/test/fetch-sources.test.sh
      - id: key
        run: echo "key=root-${{ hashFiles('why/**', 'Cargo.toml', 'Cargo.lock', '.cargo/**', '.github/workflows/ci.yml', 'ricebox/**', '.github/actions/root-packages/**') }}" >> "$GITHUB_OUTPUT"
      - id: kept
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/root-made/manifest
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install toolchains
        if: steps.kept.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools bubblewrap
          rustup target add x86_64-unknown-linux-musl wasm32-unknown-unknown
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            ricebox/sods -> target
            . -> target
          shared-key: root-${{ hashFiles('ricebox/sods/Cargo.toml', 'Cargo.toml') }}
          cache-on-failure: true
      # After rust-cache: restoring a cache from another lockfile cleans all of target/, packages included.
      - name: Build packages
        if: steps.kept.outputs.cache-hit != 'true'
        uses: ./.github/actions/root-packages
      - name: Assemble and check
        if: steps.kept.outputs.cache-hit != 'true'
        run: |
          sh why/build/guest-root.sh target/root-packages target/root-made 0.0.0
          mkdir -p target/root-open
          # Owned by root, as in a Prompt: apk will not audit a database another user owns.
          sudo tar --zstd -xf target/root-made/os-length3-linux-0.0.0-x86_64-*.tar.zst -C target/root-open
          r=$PWD/target/root-open/root
          . ricebox/distribution/pins/sources.env
          # Inside the root as a Prompt runs it: read-only, work in its /tmp.
          w=$RUNNER_TEMP/w
          mkdir -p "$w"
          inside() { sudo bwrap --ro-bind "$r" / --dev /dev --proc /proc --bind "$w" /tmp --chdir /tmp /bin/sh -c "$1"; }
          # says CMD WANT: fails, printing both, unless CMD prints WANT.
          says() { got=$(eval "$1" 2>&1 < /dev/null) || true; [ "$got" = "$2" ] || { printf 'asked: %s\nsaid:  %s\nnot:   %s\n' "$1" "$got" "$2" >&2; return 1; }; }
          # gcc parses floating literals correctly, built through make.
          printf '%s\n' '#include <stdio.h>' 'int main(void) { double f[] = {6.5, 7.3}; printf("%.17g %.17g %d\n", f[0], f[1], (int)(7.3 * 12)); return 0; }' > "$w/literals.c"
          printf 'literals: literals.c\n\tcc -O1 -o $@ literals.c\n' > "$w/Makefile"
          said=$(inside 'make -s literals && ./literals')
          [ "$said" = '6.5 7.2999999999999998 87' ] || { echo "the root's gcc compiles literals wrong: $said" >&2; exit 1; }
          # apk lists every package assembled, and every file audits clean.
          inside 'apk info' | sort > "$w/apk-info"
          { cut -d' ' -f1 target/root-packages/record; echo why; } | sort | diff - "$w/apk-info"
          audit=$(inside 'apk audit --system 2>&1' || true)
          [ -z "$audit" ] || { echo "apk audit says:" >&2; echo "$audit" >&2; exit 1; }
          inside 'openssl version' | grep -F "OpenSSL $OPENSSL_VERSION "
          # Check the new source-built distribution, not the older pinned release.
          inside 'unset OPENSSL_CONF; d=$(mktemp -d); openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj /CN=localhost -keyout $d/key.pem -out $d/cert.pem -days 1 && openssl x509 -in $d/cert.pem -noout -subject; rc=$?; rm -rf $d; exit $rc' | grep -E '^subject=CN *= *localhost$'
          inside 'curl --version' | grep -F "curl $CURL_VERSION "
          inside 'ssh -V 2>&1' | grep -F "OpenSSH_$OPENSSH_VERSION"
          inside 'git --version' | grep -F "git version $GIT_VERSION"
          # Non-ASCII names, and git init on main.
          says "inside 'touch 日本語.txt && ls 日本語.txt'" 日本語.txt
          says "inside 'git init -q r && git -C r symbolic-ref HEAD'" refs/heads/main
          # rg and fd honour .gitignore; fzf filters; yq reads YAML; tldr speaks Japanese; git pages through delta.
          mkdir -p "$w/p/.git" "$w/p/src" "$w/p/build" "$w/home"
          echo build > "$w/p/.gitignore"; echo needle > "$w/p/src/a.ts"; echo needle > "$w/p/build/b.ts"
          says "inside 'cd p && rg -l needle'" src/a.ts
          says "inside 'cd p && fd -e ts'" src/a.ts
          says "inside 'printf \"lib/x.c\\nweb/src/main.ts\\n\" | fzf --filter main'" web/src/main.ts
          says "inside 'echo \"a: {b: 1}\" | yq .a.b'" 1
          says "inside 'LANG=C.UTF-8 LANGUAGE=ja TEALDEER_CONFIG_DIR=/etc/tealdeer tldr --raw tar' | grep -q 'アーカイブ' && echo in Japanese" 'in Japanese'
          says "inside 'git config --system core.pager'" delta
          # sleep is a program, not a builtin a shell's exit would cut short.
          says "inside 'type sleep'" 'sleep is /usr/bin/sleep'
          # The Prompt's shell: z jumps by part of a name; an allowed .envrc sets the environment.
          echo 'export MADE=here' > "$w/p/src/.envrc"
          prompt() { inside "HOME=/tmp/home XDG_DATA_HOME=/tmp/home/share XDG_STATE_HOME=/tmp/home/state TERM=dumb ENV=/etc/length3/shrc sh -ic '$1' 2>/dev/null"; }
          # (z learns from cd; z DIR enters it; z - goes back.)
          says "prompt 'cd /tmp/p/src && cd / && z src && pwd'" /tmp/p/src
          says "prompt 'cd /tmp/p && z src && z - && pwd'" /tmp/p
          says "prompt 'cd /tmp/p/src && direnv allow . && echo \$MADE'" here
          # clear sends the clear sequence even on a dumb terminal (ncurses' clear prints nothing there).
          says "prompt clear | od -An -c | tr -d ' \\n'" '033[H033[2J'
          # The same programs under muk.
          cargo build -q --locked --release --target wasm32-unknown-unknown --lib --manifest-path ricebox/sods/Cargo.toml
          node ricebox/sods/runtime/run.ts "$r/usr/bin/git" --version | grep -F "git version $GIT_VERSION"
          node ricebox/sods/runtime/run.ts "$r/usr/bin/openssl" version | grep -F "OpenSSL $OPENSSL_VERSION "
          node ricebox/sods/runtime/run.ts "$r/usr/bin/busybox" sh -c 'echo $((6 * 7))' | grep -x 42
          node ricebox/sods/runtime/run.ts "$r/usr/bin/rg" --version | grep -F "ripgrep $RIPGREP_VERSION"
          printf 'lib/x.c\nweb/src/main.ts\n' | node ricebox/sods/runtime/run.ts "$r/usr/bin/fzf" --filter main | grep -x web/src/main.ts
          sudo rm -rf target/root-open
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/root-made/manifest
          key: ${{ steps.key.outputs.key }}

  # No known high or critical advisory in what ships: npm (dev dependencies left out), RustSec for both lockfiles
  # (unmaintained or unsound crates in the desktop's GTK tree are reported, not failed on), and the root's Rust
  # and Go programs.
  audit:
    name: Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm audit
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
      # cargo-audit takes five minutes to build: cached.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: audit
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - if: ${{ !cancelled() && steps.audit.outputs.cache-hit != 'true' }}
        run: cargo install --locked cargo-audit@0.22.2
      - if: ${{ !cancelled() && steps.audit.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - name: cargo audit
        if: ${{ !cancelled() }}
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file ricebox/sods/Cargo.lock
      # osv-scanner from its pinned release (modules checked against Go's checksum database), cached.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: osv
        with:
          path: ~/go/bin/osv-scanner
          key: osv-scanner-2.7.0-${{ runner.os }}
      - if: ${{ !cancelled() && steps.osv.outputs.cache-hit != 'true' }}
        run: GOTOOLCHAIN=auto go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
      - if: ${{ !cancelled() && steps.osv.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/bin/osv-scanner
          key: osv-scanner-2.7.0-${{ runner.os }}
      - name: Scan the root's programs
        if: ${{ !cancelled() }}
        run: sh ricebox/distribution/maintenance/advisories.sh ~/go/bin/osv-scanner

  # The app end to end in Chromium, in four shards, each with its own Remote and its own build of the app.
  selftest:
    name: Selftest (${{ matrix.shard }}/4)
    needs: [core-wasm, webroot]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      # The image has Chromium's system dependencies; only the browser is fetched.
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Restore core (wasm)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/wasm32-wasip1/web/why_core_web.wasm
          key: ${{ needs.core-wasm.outputs.key }}
          fail-on-cache-miss: true
      # Newer than the checkout, so why/build/core-wasm.ts (which goes by mtime) does not rebuild it.
      - run: touch target/wasm32-wasip1/web/why_core_web.wasm
      - name: Restore web root
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: why/app/public/webroot
          key: ${{ needs.webroot.outputs.key }}
          fail-on-cache-miss: true
      - name: Test
        env:
          SELFTEST_SLOW: '1'
        run: npm run selftest -- --shard=${{ matrix.shard }}/4
      - name: Upload report, traces and server logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftest-${{ matrix.shard }}
          path: |
            why/test/app/.report
            why/test/app/.results
            why/test/app/.logs
          retention-days: 14
          include-hidden-files: true
      # Passed only on a retry: the failed attempt's trace.
      - name: Upload flaky traces
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftest-flaky-${{ matrix.shard }}
          path: why/test/app/.results
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
