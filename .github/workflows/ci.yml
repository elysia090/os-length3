# Scratch proposal for a dedicated branch only. Do not merge into main or add this branch to a PR.
# This reuses the registered CI workflow path, not a release or an ordinary workflow rerun.
name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cc1plus-profile-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cc1plus-profile:
    if: github.repository == 'elysia090/os-length3' && github.event_name == 'workflow_dispatch' && github.actor == 'elysia090' && github.triggering_actor == 'elysia090' && github.ref == 'refs/heads/diag/cc1plus-28c45a6'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: integration
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 28c45a65649b1058da0ad5077624e8fd4fa3cee9
          path: product
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.3'
      - name: Verify and profile real changed-source C++
        shell: bash
        run: bash integration/.github/rx-profile/ci.sh "$GITHUB_WORKSPACE/product" "$RUNNER_TEMP"
