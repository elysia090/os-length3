name: Release

# A version publishes OS Length3 Linux X.Y.Z: asked for by a pushed tag
# os-length3-linux-vX.Y.Z, by a push that writes X.Y.Z into
# os/RELEASE (the tag is then made at that commit), or by hand. It
# publishes the root
# (every package made from this tree's pins by its recipe, os/root/build.sh,
# with this tree's l3, os/root/assemble.sh), the web build (the app with
# l3 for the browser: the same root as the browser reads it, os/scripts/l3.mjs
# and web-release.sh) and the desktop app (the
# same UI, its Prompt running that root on the machine: a .deb and an
# AppImage), with their digests. Then it proposes the pins to main as one
# pull request (Pin vX.Y.Z: the root in os/core/src/root/pins.rs, the desktop app
# in os/shared/desktop-releases.json); merged, they are what the tree ships:
# devices trust the root by its digest, the web takes that l3, and the
# Remote's deploy (os/remote/deploy.ts) takes the pinned files from the
# release and puts them on the Remote, which serves them to anyone. No
# Cloudflare credentials are kept here.
#
# Only main's commits are released (audit R1): a push to main, a tag on a
# commit main has, or a run by hand from main; anything else stops at
# Version. One version at a time (audit R2). The token can write the
# repository's contents (the release, the pins' branch), open the pins'
# pull request and attest what it made (each file's provenance, signed as
# this run) in this job alone; every action is pinned to a full commit
# (the tag is beside it).
on:
  push:
    tags: ['os-length3-linux-v*']
    branches: ['main']
    # Changing how releases are made tries again too (a published version is left).
    paths: ['os/RELEASE', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, X.Y.Z; the tag os-length3-linux-vX.Y.Z is made at this run''s commit'
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      # The provenance of what it publishes: signed with this run's identity (OIDC), kept by GitHub.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/package-lock.json
      - name: Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config zstd zip libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf libgles2 bubblewrap xvfb imagemagick
          rustup target add x86_64-unknown-linux-musl wasm32-unknown-unknown wasm32-wasip1
          # The AppImage's smoke test starts it in a bubblewrap sandbox, which needs a user namespace; this image's
          # AppArmor keeps them from unprivileged processes unless told otherwise (as the rust job of desktop.yml).
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          # What is built is what the lockfiles say (npm ci in web-release.sh; cargo here and --locked in the scripts).
          cargo fetch --locked --manifest-path os/Cargo.toml
          cargo fetch --locked --manifest-path xlat/Cargo.toml
      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # main's commits only: a branch's run stops here, and so does a tag on a commit main has not.
          case "$GITHUB_REF" in
            refs/heads/main) ;;
            refs/tags/*)
              on=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
              case "$on" in identical|behind) ;; *) echo "$GITHUB_REF_NAME is not on main ($on)" >&2; exit 1 ;; esac ;;
            *) echo "releases are made from main, not $GITHUB_REF" >&2; exit 1 ;;
          esac
          case "$GITHUB_REF" in
            refs/tags/*) v=${GITHUB_REF_NAME#os-length3-linux-v} ;;
            *) v=${INPUT_VERSION:-$(tr -d ' \n' < os/RELEASE)} ;;
          esac
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "not a version: $v" >&2; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "TAG=os-length3-linux-v$v" >> "$GITHUB_ENV"
          # A version already published is left as it is.
          if gh release view "os-length3-linux-v$v" >/dev/null 2>&1; then echo "SKIP=1" >> "$GITHUB_ENV"; echo "os-length3-linux-v$v is published already"; fi
      # The root's packages, made and kept as the root job makes and keeps them (the root-packages action).
      - if: env.SKIP != '1'
        uses: ./.github/actions/root-packages
      # What the release holds and its notes, made as by hand (os/scripts/release.sh), then published.
      - name: Root, l3 for the browser, web build and desktop app
        if: env.SKIP != '1'
        working-directory: os
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROOT_PACKAGES: ${{ github.workspace }}/os/target/root-packages
        run: sh scripts/release.sh "$GITHUB_WORKSPACE/out"
      # Every file the release holds, attested as made by this run of this workflow at this commit (SLSA build
      # provenance, signed through Sigstore): `gh attestation verify FILE -R OWNER/REPO` says so of a file anyone
      # downloaded, beside the digest a device already checks it by.
      - name: Provenance
        if: env.SKIP != '1'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*
      - name: Publish
        if: env.SKIP != '1'
        working-directory: os
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs "$GITHUB_WORKSPACE/out"
      # The pins the release wrote (release.sh: pin-root.mjs, pin-desktop.mjs), proposed to main as one
      # change; merged, the releases they no longer name are deleted (releases-prune.yml). A
      # pull request opened with this token runs no workflow; the pins are checked where they are read (the web
      # build, the deploy). Where the repository does not let Actions open pull requests, the branch is pushed and
      # its link said.
      - name: Pins, proposed to main
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="release/pin-v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add os/core/src/root/pins.rs os/shared/desktop-releases.json
          git commit -m "Pin $TAG: its root (os/core/src/root/pins.rs RELEASES) and its desktop app (os/shared/desktop-releases.json)"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$branch"
          gh pr create --base main --head "$branch" --title "Pin $TAG" \
            --body "What $TAG pinned as it was made (its notes say the same): merged, the tree ships it." \
            || echo "::warning::$branch is pushed; open its pull request: https://github.com/$GITHUB_REPOSITORY/compare/main...$branch"
