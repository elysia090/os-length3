name: Release

# Publishes OS Length3 Linux X.Y.Z: the root (root/make/build.sh, root/make/assemble.sh), the web root, the web build and
# the desktop app (.deb, AppImage), with digests and build provenance; then proposes the pins to main as one pull
# request (Pin vX.Y.Z: root3/core/src/root/pins.rs, root3/shared/desktop-releases.json). Asked for by a tag
# os-length3-linux-vX.Y.Z, by a push to main that changes root/RELEASE, or by hand.
#
# Only main's commits are released (audit R1), one version at a time (audit R2). Only this job's token writes.
# No Cloudflare credentials are kept here.
on:
  push:
    tags: ['os-length3-linux-v*']
    branches: ['main']
    # A change to this workflow tries again (a published version is left as it is).
    paths: ['root/RELEASE', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, X.Y.Z; the tag os-length3-linux-vX.Y.Z is made at this run''s commit'
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      # The provenance of what it publishes: signed with this run's identity (OIDC), kept by GitHub.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config zstd zip libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf libgles2 bubblewrap xvfb imagemagick
          rustup target add x86_64-unknown-linux-musl wasm32-unknown-unknown wasm32-wasip1
          # The AppImage's smoke test runs it under bwrap, which needs user namespaces (restricted by AppArmor here).
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
          # Built as the lockfiles say (npm ci in web-release.sh; --locked in the scripts).
          cargo fetch --locked --manifest-path Cargo.toml
          cargo fetch --locked --manifest-path module/sods/Cargo.toml
      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # main's commits only: a branch, or a tag on a commit main lacks, stops here.
          case "$GITHUB_REF" in
            refs/heads/main) ;;
            refs/tags/*)
              on=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
              case "$on" in identical|behind) ;; *) echo "$GITHUB_REF_NAME is not on main ($on)" >&2; exit 1 ;; esac ;;
            *) echo "releases are made from main, not $GITHUB_REF" >&2; exit 1 ;;
          esac
          case "$GITHUB_REF" in
            refs/tags/*) v=${GITHUB_REF_NAME#os-length3-linux-v} ;;
            *) v=${INPUT_VERSION:-$(tr -d ' \n' < root/RELEASE)} ;;
          esac
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "not a version: $v" >&2; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "TAG=os-length3-linux-v$v" >> "$GITHUB_ENV"
          # A version already published is left as it is.
          if gh release view "os-length3-linux-v$v" >/dev/null 2>&1; then echo "SKIP=1" >> "$GITHUB_ENV"; echo "os-length3-linux-v$v is published already"; fi
      - name: Build root packages
        if: env.SKIP != '1'
        uses: ./.github/actions/root-packages
      - name: Build release files
        if: env.SKIP != '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROOT_PACKAGES: ${{ github.workspace }}/target/root-packages
        run: sh scripts/release.sh "$GITHUB_WORKSPACE/out"
      # SLSA build provenance for every file, signed through Sigstore: `gh attestation verify FILE -R OWNER/REPO`.
      - name: Attest provenance
        if: env.SKIP != '1'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*
      - name: Publish
        if: env.SKIP != '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.ts "$GITHUB_WORKSPACE/out"
      # Merged, releases the pins no longer name are deleted (prune-releases.yml). A pull request opened with this
      # token runs no workflow: the pins are checked where they are read (the web build, the deploy). Where Actions
      # may not open pull requests, the branch is pushed and its link printed.
      - name: Propose pins to main
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="release/pin-v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add root3/core/src/root/pins.rs root3/shared/desktop-releases.json
          git commit -m "Pin $TAG: its root (root3/core/src/root/pins.rs RELEASES) and its desktop app (root3/shared/desktop-releases.json)"
          git push "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" "$branch"
          gh pr create --base main --head "$branch" --title "Pin $TAG" \
            --body "What $TAG pinned as it was made (its notes say the same): merged, the tree ships it." \
            || echo "::warning::$branch is pushed; open its pull request: https://github.com/$GITHUB_REPOSITORY/compare/main...$branch"
