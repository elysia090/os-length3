name: Release

# A version publishes OS Length3 Linux X.Y.Z: asked for by a pushed tag
# os-length3-linux-vX.Y.Z, by a push that writes X.Y.Z into
# src/desktop/RELEASE (the tag is then made at that commit), or by hand. It
# publishes the root
# (the pinned 0.1.0 root with this tree's l3, profile and shell, repackaged
# by src/desktop/scripts/root-release.sh) and the web build (the app with
# the Prompt's userland, src/desktop/scripts/web-release.sh), with their
# digests. Devices then trust the root once its digest is pinned in
# src/desktop/core/src/root.rs.
on:
  push:
    tags: ['os-length3-linux-v*']
    branches: ['**']
    # Changing how releases are made tries again too (a published version is left).
    paths: ['src/desktop/RELEASE', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, X.Y.Z; the tag os-length3-linux-vX.Y.Z is made at this run''s commit'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/desktop/package-lock.json
      - name: Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools zstd zip
          rustup target add x86_64-unknown-linux-musl wasm32-unknown-unknown
      - name: Version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) v=${GITHUB_REF_NAME#os-length3-linux-v} ;;
            *) v=${INPUT_VERSION:-$(tr -d ' \n' < src/desktop/RELEASE)} ;;
          esac
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "not a version: $v" >&2; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "TAG=os-length3-linux-v$v" >> "$GITHUB_ENV"
          # A version already published is left as it is.
          if gh release view "os-length3-linux-v$v" >/dev/null 2>&1; then echo "SKIP=1" >> "$GITHUB_ENV"; echo "os-length3-linux-v$v is published already"; fi
      - name: Root
        if: env.SKIP != '1'
        working-directory: src/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The base is the 0.1.0 release's root; root-release.sh checks its digest.
          gh release download os-length3-linux-v0.1.0 --pattern 'os-length3-linux-0.1.0-x86_64-*.tar.zst' --output "$RUNNER_TEMP/base.tar.zst"
          sh scripts/root-release.sh "$RUNNER_TEMP/base.tar.zst" "$GITHUB_WORKSPACE/out" "$VERSION"
      - name: The root for the browser
        if: env.SKIP != '1'
        working-directory: src/desktop
        run: |
          # The same root, as packs (one per package, named by what each holds) the browser's Prompt reads file by file (scripts/webroot.mjs).
          mkdir -p "$RUNNER_TEMP/opened"
          tar --zstd -xf "$GITHUB_WORKSPACE"/out/os-length3-linux-$VERSION-x86_64-*.tar.zst -C "$RUNNER_TEMP/opened"
          node scripts/webroot.mjs "$RUNNER_TEMP/opened/root" public/root
      - name: Web
        if: env.SKIP != '1'
        working-directory: src/desktop
        run: |
          sh scripts/web-release.sh
          mv length3-web.zip "$GITHUB_WORKSPACE/out/os-length3-linux-$VERSION-web.zip"
      - name: Digests and notes
        if: env.SKIP != '1'
        working-directory: out
        run: |
          sha256sum os-length3-linux-$VERSION-web.zip >> SHA256SUMS
          root=$(ls os-length3-linux-$VERSION-x86_64-*.tar.zst)
          web=os-length3-linux-$VERSION-web.zip
          {
            echo "# OS Length3 Linux $VERSION"
            echo
            echo "The 0.1.0 root with l3, its profile and shell from \`$GITHUB_SHA\`, and the web build of the same tree, whose Prompt runs that whole root (each file fetched when a program first reads it)."
            echo
            echo "| File | Bytes | SHA-256 |"
            echo "| --- | --- | --- |"
            for f in "$root" "$web"; do
              echo "| \`$f\` | $(stat -c %s "$f") | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
            echo
            echo "Check and open the root:"
            echo
            echo '```sh'
            echo "sha256sum -c SHA256SUMS"
            echo "mkdir opened && tar --zstd -xf $root -C opened"
            echo '```'
            echo
            echo "\`manifest\` names the base, the l3 inside and the script that made it. The web build opens with any static server (\`npx serve\` in the unzipped folder)."
          } > ../notes.md
          cat ../notes.md
      - name: Publish
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pushed tag is used as it is; from a run by hand, the tag is made at this commit.
          gh release create "$TAG" out/* --target "$GITHUB_SHA" \
            --title "OS Length3 Linux $VERSION" --notes-file notes.md
