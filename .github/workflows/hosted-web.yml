name: Hosted Linux delivery checks
on:
  push:
    branches: [codex/native-release-wasm-1002]
    paths: ['data/distribution/*cloudflare*', 'data/oracle/check-cloudflare-web.mjs', 'wrangler.toml', '.github/workflows/hosted-web.yml']
  pull_request:
    paths: ['data/distribution/*cloudflare*', 'data/oracle/check-cloudflare-web.mjs', 'wrangler.toml', '.github/workflows/hosted-web.yml']
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node data/distribution/prepare-cloudflare-web.mjs
      - run: node data/oracle/check-cloudflare-web.mjs
