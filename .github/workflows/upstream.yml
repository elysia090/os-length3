name: Upstream

# The newest release of every source the root is built from (root/pins/sources.env), with digests to pin it by, and
# every current pin downloaded and checked (root/make/next.py): a table in the summary, the proposed files as an
# artifact. Also the root's Rust and Go programs against advisories published since (root/make/advisories.sh). A broken
# pin or an advisory that reaches one fails the run. Weekly, by hand, or when the pins or scripts change; nothing is
# pushed.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/upstream.yml', 'root/make/next.py', 'root/pins/sources.env', 'root/make/advisories.sh', 'root/pins/advisories.toml']

permissions:
  contents: read

jobs:
  newest:
    name: Newest releases
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find newest releases
        run: |
          set -o pipefail
          python3 root/make/next.py root/pins/sources.env | tee table.txt
          { echo '```'; cat table.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          for f in *.next; do echo "--- $f"; cat "$f"; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream
          path: |
            *.next
            table.txt
          retention-days: 30

  advisories:
    name: Advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # From its pinned release; its modules checked against Go's checksum database.
      - name: Install osv-scanner
        run: GOTOOLCHAIN=auto go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
      - name: Scan the root's programs
        run: |
          set -o pipefail
          OSV_FORMAT=markdown sh root/make/advisories.sh ~/go/bin/osv-scanner | tee -a "$GITHUB_STEP_SUMMARY"
