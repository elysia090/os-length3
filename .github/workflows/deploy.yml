name: Deploy

# main is what runs: each push to it that changes the product ships the
# Remote and the web app, one Worker on Cloudflare (os/service/wrangler.toml)
# over Neon's production branch, built from this tree as a release builds it
# (os/service/deploy.ts says what is given and kept). No branch is made for a
# deploy, in git or in Neon.
#
# Neon's GitHub integration keeps NEON_API_KEY (a secret) and NEON_PROJECT_ID
# (a variable) here. Cloudflare's lets Cloudflare read the repository and
# nothing more, so its token is kept here too (Settings → Secrets and
# variables → Actions):
#   CLOUDFLARE_API_TOKEN   the "Edit Cloudflare Workers" template, for the account and the zone length3.com
#   CLOUDFLARE_ACCOUNT_ID  only when that token reaches more than one account
#   ENTER_KEY              only to choose the research link's key; else one is made the first time,
#                          and its link is put in that run's summary
on:
  push:
    branches: [main]
    paths: ['os/**', 'xlat/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
    inputs:
      link:
        description: 'A new link: the old one opens nothing, and its sessions end'
        type: boolean
        default: false

# One at a time, each to its end: a deploy cut off halfway could leave the database ahead of the Worker.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ready:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - id: ready
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
        run: |
          missing=
          for k in CLOUDFLARE_API_TOKEN NEON_API_KEY NEON_PROJECT_ID; do
            [ -n "$(printenv $k)" ] || missing="$missing $k"
          done
          if [ -n "$missing" ]; then
            echo "::notice::Not deployed: the repository has no$missing"
            echo ready=0 >> "$GITHUB_OUTPUT"
          else
            echo ready=1 >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: ready
    if: needs.ready.outputs.ready == '1'
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/package-lock.json
      - name: Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools zstd zip
          rustup target add x86_64-unknown-linux-musl wasm32-unknown-unknown
      - name: The root for the browser
        working-directory: os
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # As a release makes it (release.yml): the 0.1.0 root with this tree's l3, as packs the browser's Prompt reads file by file.
          gh release download os-length3-linux-v0.1.0 --pattern 'os-length3-linux-0.1.0-x86_64-*.tar.zst' --output "$RUNNER_TEMP/base.tar.zst"
          sh scripts/root-release.sh "$RUNNER_TEMP/base.tar.zst" "$RUNNER_TEMP/out" "$(tr -d ' \n' < RELEASE)"
          mkdir -p "$RUNNER_TEMP/opened"
          tar --zstd -xf "$RUNNER_TEMP"/out/os-length3-linux-*-x86_64-*.tar.zst -C "$RUNNER_TEMP/opened"
          node scripts/webroot.mjs "$RUNNER_TEMP/opened/root" public/root
      - name: Web
        working-directory: os
        run: sh scripts/web-release.sh
      - name: Ship
        working-directory: os
        env:
          ENTER_KEY: ${{ secrets.ENTER_KEY }}
        run: node service/deploy.ts
      - name: A new link
        if: inputs.link
        working-directory: os
        run: node service/deploy.ts link
