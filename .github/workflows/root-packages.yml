name: Root packages

# The root's packages built from their pins by their recipes (root/build.sh, via the root-packages action) whenever
# their inputs change, and cached for CI's Root job and the release.
on:
  push:
    paths: ['root/build.sh', 'root/packages/**', 'root/sources.env', 'root/etc/**', 'module/you/**', 'module/otter/**', 'module/lib/**', '.github/actions/root-packages/**', '.github/workflows/root-packages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-24.04
    # A cold build is mostly GCC.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        uses: ./.github/actions/root-packages
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          cat target/root-packages/record 2>/dev/null || true
          du -sh target/root-packages/*/tree 2>/dev/null | sort -h | tail -20 || true
