# Publish the browser shell to GitHub Pages.
#
# The product shell is plain static files under src/v2/web. Its authenticated
# object tree is the generated sibling src/v2/artifact, which is not committed;
# `make site` copies it in when a distribution build has produced it, so CI
# publishes the shell by itself. The same assembly step is what `wrangler
# deploy` runs, so the two deployments cannot drift.

name: Deploy Quotient Minimizer

on:
  push:
    branches: [main]
    paths: ['src/v2/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build the native products
        run: make -C src/v2 -j4 all
      - name: Assemble the static site
        run: make -C src/v2 site SITE="$GITHUB_WORKSPACE/_site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
