name: Desktop, l3 and xlat

# The product: the app (os), the l3 command and its core, and the
# x86-64 → wasm translator the Prompt runs on.
on:
  # A change is tested once: in its pull request, on what merging it would make (refs/pull/N/merge), so
  # main is not tested again when it lands. A branch without a pull request runs by hand.
  pull_request:
    paths: ['os/**', 'xlat/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

# Nothing here writes: the token reads the repository and nothing else. Every action is pinned
# to the full commit its tag named when it was pinned (the tag is beside it), so a moved tag
# runs nothing new; Dependabot (.github/dependabot.yml) proposes each update.
permissions:
  contents: read

# A newer push to the same pull request (or branch) stops the run it makes old.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Each job builds once: incremental artifacts only make the cache larger.
  CARGO_INCREMENTAL: '0'
# What rust-cache keeps is keyed by each workspace's own Cargo.toml as well (in its shared-key, or key): rust-cache
# hashes its members' manifests and the lockfile, not the workspace's, where [profile] is, and keeps nothing again
# while its key is met, so a build made with a profile since changed (debug info, LTO) was restored and then
# rebuilt by every run until the lockfile changed.

# Every job side by side, so the run takes as long as its longest (about two minutes when what is kept is
# still good), and one failure never hides another. Nothing is made twice: what the tests share (the core
# for the browser, l3 for the browser) is made once by a job of its own, kept by what it is made from, and
# made at all only when that changed; the unit tests and the selftest run as four shards each.
jobs:
  # The core as a browser runs it (core/web for wasm32-wasip1), for the unit tests and the selftest.
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: key
        run: echo "key=core-wasm-${{ hashFiles('os/core/src/**', 'os/core/web/src/**', 'os/core/Cargo.toml', 'os/core/web/Cargo.toml', 'os/Cargo.toml', 'os/Cargo.lock', 'os/shared/templates.json', 'os/scripts/core-wasm.ts') }}" >> "$GITHUB_OUTPUT"
      - id: kept
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: os/target/wasm32-wasip1/web/length3_core_web.wasm
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.kept.outputs.cache-hit != 'true'
        run: rustup target add wasm32-wasip1
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: os -> target
          shared-key: core-wasm-${{ hashFiles('os/Cargo.toml') }}
          cache-on-failure: true
      - if: steps.kept.outputs.cache-hit != 'true'
        working-directory: os
        run: cargo build --locked --profile web -p length3-core-web --target wasm32-wasip1
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: os/target/wasm32-wasip1/web/length3_core_web.wasm
          key: ${{ steps.key.outputs.key }}

  # l3 for the browser: made from the root this tree pins (core/src/root.rs, for RELEASE) with this tree's
  # translator, and checked to hold the same paths, types, modes, link targets and bytes as that root; for the
  # selftest. Made only when the root or the translator changed.
  l3-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: key
        run: echo "key=l3-web-${{ hashFiles('os/RELEASE', 'os/core/src/root.rs', 'os/service/releases.ts', 'os/scripts/l3.sh', 'os/scripts/l3.mjs', 'os/scripts/l3-tree.mjs', 'os/scripts/root-file.mjs', 'os/scripts/l3-parity.mjs', 'xlat/Cargo.toml', 'xlat/Cargo.lock', 'xlat/src/**') }}" >> "$GITHUB_OUTPUT"
      - id: kept
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: os/public/l3
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/package-lock.json
      - if: steps.kept.outputs.cache-hit != 'true'
        run: rustup target add wasm32-unknown-unknown
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: xlat -> target
          shared-key: l3-web-${{ hashFiles('xlat/Cargo.toml') }}
          cache-on-failure: true
      - name: l3 for the browser, made from the root this tree pins, and the same as it
        if: steps.kept.outputs.cache-hit != 'true'
        working-directory: os
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          root=$(node scripts/root-file.mjs target/root)
          sh scripts/l3.sh "$root" public/l3
          node scripts/l3-parity.mjs "$root" public/l3
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: os/public/l3
          key: ${{ steps.key.outputs.key }}

  # The page's and the Remote's types. (The build that ships is the one the selftest builds and uses.)
  types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/package-lock.json
      - working-directory: os
        run: |
          npm ci
          npx tsc --noEmit

  # The page's and the Remote's tests (the browser's core is the same Rust, built for wasm32-wasip1), in four
  # shards: node gives each every fourth test file.
  unit:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/package-lock.json
      - name: The core for the browser, as the core job made it
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: os/target/wasm32-wasip1/web/length3_core_web.wasm
          key: ${{ needs.core.outputs.key }}
          fail-on-cache-miss: true
      # Newer than the sources the checkout just wrote, so nothing builds it again (scripts/core-wasm.ts goes by time).
      - run: touch os/target/wasm32-wasip1/web/length3_core_web.wasm
      - name: Packages
        working-directory: os
        run: npm ci
      - name: Tests
        working-directory: os
        env:
          NODE_OPTIONS: --test-shard=${{ matrix.shard }}/4
        run: npm test

  # The core and l3 linted with clippy -D warnings, natively and as a browser builds the core.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add wasm32-wasip1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: os -> target
          shared-key: lint-${{ hashFiles('os/Cargo.toml') }}
          cache-on-failure: true
      # Each step below runs whatever failed before it (only a cancel stops them), so one failure never
      # hides another as skipped: the job fails for each that fails.
      - name: Lint (the app's window needs GTK, so its crate is linted where it is built)
        working-directory: os
        run: cargo clippy --locked --all-targets -p length3-core -p length3-core-web -p l3 -- -D warnings
      - name: Lint the core as a browser builds it
        if: ${{ !cancelled() }}
        working-directory: os
        run: cargo clippy --locked -p length3-core -p length3-core-web --target wasm32-wasip1 -- -D warnings

  # The core's and l3's own tests, then l3 end to end against a Remote of its own (the l3 they built).
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/package-lock.json
      - name: Toolchains
        run: |
          # l3 prompt makes user namespaces, as on a person's machine; this image's AppArmor keeps them from users.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: os -> target
          shared-key: rust-${{ hashFiles('os/Cargo.toml') }}
          cache-on-failure: true
      - name: Core and l3
        working-directory: os
        run: cargo test --locked -p length3-core -p l3
      - name: l3 end to end, against a Remote of its own
        if: ${{ !cancelled() }}
        working-directory: os
        run: |
          npm ci
          npm run selftest:l3

  # The x86-64 → wasm translator against native, and l3 as the Prompt carries it (static, musl), translated
  # as a browser's Prompt runs it: the two side by side, each its own build kept.
  xlat:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        part: [native, prompt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            xlat -> target
            os -> target
          shared-key: xlat-${{ matrix.part }}-${{ hashFiles('xlat/Cargo.toml', 'os/Cargo.toml') }}
          cache-on-failure: true
      - name: xlat against native (C and Rust std), and its unit tests
        if: matrix.part == 'native'
        working-directory: xlat
        run: sh tests/run.sh
      # The translator as the browser runs it (run.mjs takes the wasm build when it is current).
      - name: l3 for the Prompt (static, musl), translated as the Prompt runs it
        if: matrix.part == 'prompt'
        working-directory: os
        run: |
          cargo build -q --locked --release --target wasm32-unknown-unknown --lib --manifest-path ../xlat/Cargo.toml
          cargo build --locked --profile prompt -p l3 --no-default-features --target x86_64-unknown-linux-musl
          out=$(LENGTH3_REPOS=/root node ../xlat/runtime/run.mjs target/x86_64-unknown-linux-musl/prompt/l3 help all)
          echo "$out" | head -3
          echo "$out" | grep -q 'l3 issue new'

  # The desktop app on the other machines it is for, each built on its own: macOS (Apple silicon and Intel), Windows
  # and Linux on Arm. There its Prompts run translated (l3 root check says why), as a browser's do; l3 is built for
  # the machine and goes beside the app, as on Linux x86-64 (scripts/desktop.sh), and each is bundled as its
  # machine installs it.
  elsewhere:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: aarch64-apple-darwin, bundles: app}
          - {os: macos-15-intel, target: x86_64-apple-darwin, bundles: app}
          - {os: windows-2025, target: x86_64-pc-windows-msvc, bundles: nsis}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, bundles: deb}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/package-lock.json
      - name: Linux's webview
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: os -> target
          key: ${{ matrix.target }}-${{ hashFiles('os/Cargo.toml') }}
      - name: l3 and the app, built and bundled here
        working-directory: os
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          npm ci
          # tauri build builds the app for its minimum macOS (MACOSX_DEPLOYMENT_TARGET: bundle.macOS.minimumSystemVersion,
          # 10.13 when it is not set): l3, which goes beside it, is built for the same, and what both build (ring's C,
          # whose build runs again when that changes) is built once.
          if [ "$RUNNER_OS" = macOS ]; then
            export MACOSX_DEPLOYMENT_TARGET=$(node -p "require('./src-tauri/tauri.conf.json').bundle?.macOS?.minimumSystemVersion ?? '10.13'")
          fi
          cargo build --locked --release -p l3
          ext=; [ "$RUNNER_OS" = Windows ] && ext=.exe
          mkdir -p src-tauri/binaries
          cp "target/release/l3$ext" "src-tauri/binaries/l3-$TARGET$ext"
          "target/release/l3$ext" root check
          npx tauri build --bundles "$BUNDLES" --config '{"build": {"beforeBuildCommand": "npx vite build"}, "bundle": {"externalBin": ["binaries/l3"]}}'

  # The .deb's AppArmor profile (os/src-tauri/deb) on Ubuntu 24.04 as a person has it, user namespaces kept from
  # unprivileged programs: l3 at /usr/bin/l3 says Prompts cannot run on the root here (l3 root check: the namespaces
  # one is made in cannot be made) until the .deb's postinst has put the profile in place, and can after; its postrm
  # takes it away again.
  apparmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: os -> target
          shared-key: rust-${{ hashFiles('os/Cargo.toml') }}
      - name: The .deb's profile lets /usr/bin/l3 make user namespaces where they are kept from programs
        working-directory: os
        run: |
          [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1 ]
          cargo build -q --locked -p l3
          sudo install -m 0755 target/debug/l3 /usr/bin/l3
          native() { /usr/bin/l3 root check --json | node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(0, "utf8")).native))'; }
          [ "$(native)" = false ] || { echo "user namespaces were not kept from /usr/bin/l3 to begin with" >&2; exit 1; }
          /usr/bin/l3 root check
          sudo install -D -m 0644 src-tauri/deb/length3-l3.apparmor /usr/share/length3-os/apparmor/length3-l3
          sudo sh src-tauri/deb/postinst configure
          [ "$(native)" = true ] || { /usr/bin/l3 root check; exit 1; }
          sudo sh src-tauri/deb/postrm remove
          [ ! -e /etc/apparmor.d/length3-l3 ]
          [ "$(native)" = false ] || { echo "the profile stayed after postrm" >&2; exit 1; }

  # The root as a release makes it: each package made from its pin by its recipe on Alpine 3.24 at one digest
  # (os/root/build.sh; each kept from run to run and made again only when what it is made of changed), put together
  # with this tree's l3 (os/root/assemble.sh), then used: run inside the root as a Prompt runs it (read-only, its own /tmp),
  # its database audited against what is there, and translated as the browser's Prompt runs it. Made only when what
  # makes the root changed.
  root:
    runs-on: ubuntu-24.04
    # Every package made the first time (GCC most of all) takes most of an hour; after, a pin raised makes that
    # package and what is built against it.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: key
        run: echo "key=root-${{ hashFiles('os/root/**', '.github/actions/root-packages/**') }}" >> "$GITHUB_OUTPUT"
      - id: kept
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: os/target/root-made/manifest
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: ./.github/actions/root-packages
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Toolchains
        if: steps.kept.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools bubblewrap
          rustup target add x86_64-unknown-linux-musl wasm32-unknown-unknown
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            xlat -> target
            os -> target
          shared-key: root-${{ hashFiles('xlat/Cargo.toml', 'os/Cargo.toml') }}
          cache-on-failure: true
      - name: The root, put together, and used
        if: steps.kept.outputs.cache-hit != 'true'
        working-directory: os
        run: |
          sh root/assemble.sh target/root-packages target/root-made 0.0.0
          mkdir -p target/root-open
          tar --zstd -xf target/root-made/os-length3-linux-0.0.0-x86_64-*.tar.zst -C target/root-open
          r=$PWD/target/root-open/root
          . root/sources.env
          # Inside the root as a Prompt runs it: read-only, so the work is its /tmp, which it has.
          w=$RUNNER_TEMP/w
          mkdir -p "$w"
          inside() { sudo bwrap --ro-bind "$r" / --dev /dev --proc /proc --bind "$w" /tmp --chdir /tmp /bin/sh -c "$1"; }
          # Its compiler is right: floating literals as C says them, built by its make.
          printf '%s\n' '#include <stdio.h>' 'int main(void) { double f[] = {6.5, 7.3}; printf("%.17g %.17g %d\n", f[0], f[1], (int)(7.3 * 12)); return 0; }' > "$w/literals.c"
          printf 'literals: literals.c\n\tcc -O1 -o $@ literals.c\n' > "$w/Makefile"
          said=$(inside 'make -s literals && ./literals')
          [ "$said" = '6.5 7.2999999999999998 87' ] || { echo "the root's gcc compiles literals wrong: $said" >&2; exit 1; }
          # Its database says every package put together, and every file in it is as it was made.
          inside 'apk info' | sort > "$w/apk-info"
          { cut -d' ' -f1 target/root-packages/record; echo l3; } | sort | diff - "$w/apk-info"
          audit=$(inside 'apk audit --system 2>&1' || true)
          [ -z "$audit" ] || { echo "apk audit says:" >&2; echo "$audit" >&2; exit 1; }
          inside 'openssl version' | grep -F "OpenSSL $OPENSSL_VERSION "
          inside 'curl --version' | grep -F "curl $CURL_VERSION "
          inside 'ssh -V 2>&1' | grep -F "OpenSSH_$OPENSSH_VERSION"
          inside 'git --version' | grep -F "git version $GIT_VERSION"
          # And translated, as the browser's Prompt runs them.
          cargo build -q --locked --release --target wasm32-unknown-unknown --lib --manifest-path ../xlat/Cargo.toml
          node ../xlat/runtime/run.mjs "$r/usr/bin/git" --version | grep -F "git version $GIT_VERSION"
          node ../xlat/runtime/run.mjs "$r/usr/bin/openssl" version | grep -F "OpenSSL $OPENSSL_VERSION "
          node ../xlat/runtime/run.mjs "$r/usr/bin/busybox" sh -c 'echo $((6 * 7))' | grep -x 42
          rm -rf target/root-open
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: os/target/root-made/manifest
          key: ${{ steps.key.outputs.key }}

  # What ships has no known high or critical advisory: npm's (build-only tools such as drizzle-kit are dev
  # dependencies, left out) and RustSec's against both lockfiles (an unmaintained or unsound crate deep in the
  # desktop's GTK tree is said, not failed on).
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/package-lock.json
      - name: npm
        working-directory: os
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
      # cargo-audit built once and kept (it takes five minutes to compile), kept even when the audit fails.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: audit
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - if: ${{ !cancelled() && steps.audit.outputs.cache-hit != 'true' }}
        run: cargo install --locked cargo-audit@0.22.2
      - if: ${{ !cancelled() && steps.audit.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - name: Rust
        if: ${{ !cancelled() }}
        run: |
          cargo audit --file os/Cargo.lock
          cargo audit --file xlat/Cargo.lock

  # The app end to end, as a person uses it (os/selftest): Chromium against a fresh Remote of its own, in four
  # shards, each with its own Remote and its own build of the app (the build that ships, for a Remote on its own
  # origin).
  selftest:
    needs: [core, l3-web]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/package-lock.json
      - name: Packages
        working-directory: os
        run: npm ci
      - name: Chromium, kept by the version Playwright asks for
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('os/node_modules/playwright-core/browsers.json') }}
      # This image has what Chromium needs from the system (it carries Chrome); only the browser is fetched.
      - working-directory: os
        run: npx playwright install chromium
      - name: The core for the browser, as the core job made it
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: os/target/wasm32-wasip1/web/length3_core_web.wasm
          key: ${{ needs.core.outputs.key }}
          fail-on-cache-miss: true
      # Newer than the sources the checkout just wrote, so nothing builds it again (scripts/core-wasm.ts goes by time).
      - run: touch os/target/wasm32-wasip1/web/length3_core_web.wasm
      - name: l3 for the browser, as the l3-web job made it
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: os/public/l3
          key: ${{ needs.l3-web.outputs.key }}
          fail-on-cache-miss: true
      - name: Selftest (with the Prompt's @slow tests)
        working-directory: os
        env:
          SELFTEST_SLOW: '1'
        run: npm run selftest -- --shard=${{ matrix.shard }}/4
      # Failed: the report, every failed attempt's trace and screenshot, and what the two servers printed.
      - name: Report, traces and the servers' logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftest-${{ matrix.shard }}
          path: |
            os/selftest/.report
            os/selftest/.results
            os/selftest/.logs
          retention-days: 14
          include-hidden-files: true
      # Passed, but only on a retry (flaky): the failed attempt's trace is kept too, to be read.
      - name: Traces of attempts that failed before passing
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selftest-flaky-${{ matrix.shard }}
          path: os/selftest/.results
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
