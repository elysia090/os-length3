name: Desktop, l3 and xlat

# The product: the app (os), the l3 command and its core, and the
# x86-64 → wasm translator the Prompt runs on.
on:
  push:
    paths: ['os/**', 'xlat/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['os/**', 'xlat/**', '.github/workflows/desktop.yml']

# Nothing here writes: the token reads the repository and nothing else. Every action is pinned
# to the full commit its tag named when it was pinned (the tag is beside it), so a moved tag
# runs nothing new; Dependabot (.github/dependabot.yml) proposes each update.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/package-lock.json
      - name: Toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl wasm32-unknown-unknown
      - name: App (types, tests, web build)
        working-directory: os
        run: |
          npm ci
          npm run check
          npx vite build
      # What the Remote and the app ship with: no known high or critical advisory (build-only tools
      # such as drizzle-kit are dev dependencies, and are left out).
      - name: Advisories in what ships
        working-directory: os
        run: npm audit --omit=dev --audit-level=high
      - name: Core and l3
        working-directory: os
        run: |
          cargo test --locked -p length3-core -p l3
          cargo build --locked --profile prompt -p l3 --no-default-features --target x86_64-unknown-linux-musl
      - name: l3 end to end, against a Remote of its own
        working-directory: os
        run: npm run selftest:l3
      - name: xlat against native (C and Rust std), and its unit tests
        working-directory: xlat
        run: sh tests/run.sh
      - name: l3 translated, as the Prompt runs it
        working-directory: os
        run: |
          out=$(LENGTH3_REPOS=/root node ../xlat/runtime/run.mjs target/x86_64-unknown-linux-musl/prompt/l3 help all)
          echo "$out" | head -3
          echo "$out" | grep -q 'l3 issue new'

  # The app end to end, as a person uses it (os/selftest): Chromium against a
  # fresh Remote of its own. A job of its own, beside check, so neither waits.
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: os/package-lock.json
      - name: Packages and Chromium
        working-directory: os
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: The Prompt's files, from the release RELEASE names
        working-directory: os
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prompt-files.mjs
      - name: Selftest (with the Prompt's @slow tests)
        working-directory: os
        env:
          SELFTEST_SLOW: '1'
        run: npm run selftest
      # Failed: the report, every failed attempt's trace and screenshot, and what the two servers printed.
      - name: Report, traces and the servers' logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selftest
          path: |
            os/selftest/.report
            os/selftest/.results
            os/selftest/.logs
          retention-days: 14
      # Passed, but only on a retry (flaky): the failed attempt's trace is kept too, to be read.
      - name: Traces of attempts that failed before passing
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: selftest-flaky
          path: os/selftest/.results
          if-no-files-found: ignore
          retention-days: 14
