name: Native distribution checks

on:
  push:
    branches: [main, codex/native-release-wasm-1002]
    paths:
      - '.github/workflows/runtime-adapters.yml'
      - 'src/v2/Makefile'
      - 'data/distribution/prepare-qualified-native-release.py'
      - 'data/oracle/check-native-producer-dhcp.sh'
      - 'data/oracle/seed-image.mjs'
      - 'data/oracle/network-host-linux.go'
      - 'data/oracle/inspect-dhcp-printf-table.mjs'
      - 'data/oracle/check-readiness-mounts.mjs'
      - 'data/distribution/boot/ready'
      - 'data/distribution/boot/boot'
      - 'data/distribution/*package-payload.sh'
      - 'data/distribution/package-recipes.sh'
      - 'data/distribution/*normalize-initramfs.py'
      - 'data/distribution/*package-set*.sh'
      - 'data/distribution/*native-bundle*'
      - 'data/distribution/*producer*'
      - 'data/distribution/optimize-payload.sh'
      - 'data/distribution/check-postlink-toolchain.sh'
      - 'data/build.sh'
      - 'artifact/native/evidence/2026-10-12-dhcp-syslog-root-cause.json'
      - 'src/v2/artifact/**'
      - 'src/v2/support/**'
  pull_request:
    paths:
      - '.github/workflows/runtime-adapters.yml'
      - 'src/v2/Makefile'
      - 'data/distribution/prepare-qualified-native-release.py'
      - 'data/oracle/check-native-producer-dhcp.sh'
      - 'data/oracle/seed-image.mjs'
      - 'data/oracle/network-host-linux.go'
      - 'data/oracle/inspect-dhcp-printf-table.mjs'
      - 'data/oracle/check-readiness-mounts.mjs'
      - 'data/distribution/boot/ready'
      - 'data/distribution/boot/boot'
      - 'data/distribution/*package-payload.sh'
      - 'data/distribution/package-recipes.sh'
      - 'data/distribution/*normalize-initramfs.py'
      - 'data/distribution/*package-set*.sh'
      - 'data/distribution/*native-bundle*'
      - 'data/distribution/*producer*'
      - 'data/distribution/optimize-payload.sh'
      - 'data/distribution/check-postlink-toolchain.sh'
      - 'data/build.sh'
      - 'artifact/native/evidence/2026-10-12-dhcp-syslog-root-cause.json'
      - 'src/v2/artifact/**'
      - 'src/v2/support/**'

permissions:
  contents: read

jobs:
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check release scripts, boot and readiness
        run: |
          python3 -m py_compile data/distribution/prepare-qualified-native-release.py
          node --check data/oracle/seed-image.mjs
          bash -n data/oracle/check-native-producer-dhcp.sh
          node --check data/oracle/inspect-dhcp-printf-table.mjs
          bash -n data/distribution/boot/ready
          bash -n data/distribution/boot/boot
          bash -n data/distribution/boot/console
          bash -n data/initramfs/init
          bash -n data/oracle/standard-provider-check.sh
          bash -n data/oracle/standard-distribution-check.sh
          node data/oracle/check-readiness-mounts.mjs
      - name: Check package-set input cuts and reuse
        run: |
          make -C src/v2/artifact -j2 all namespace-check namespace-xattrs-check
          sudo bash data/distribution/check-package-set-content.sh
          bash data/distribution/check-package-payload.sh
          bash data/distribution/check-service-sources-fixture.sh
          python3 data/distribution/check-normalize-initramfs.py
      - name: Check native acceptance artifact and policy binding
        run: |
          sudo python3 data/distribution/check-native-bundle-acceptance.py --require-capture
          sudo python3 data/distribution/check-producer-execution.py --require-native
          python3 data/distribution/check-producer-binding.py
          bash -n data/distribution/build-producer-cut.sh data/distribution/producer-run.sh data/distribution/optimize-payload.sh data/distribution/check-postlink-toolchain.sh data/build.sh
