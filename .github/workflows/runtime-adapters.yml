name: Runtime adapter checks

on:
  push:
    branches: [main, codex/native-release-wasm-1002]
    paths:
      - '.github/workflows/runtime-adapters.yml'
      - 'src/v2/web/**'
      - 'src/v2/vm/check/browser/storage-failures*'
      - 'src/v2/vm/check/browser/candidate-*'
      - 'src/v2/vm/check/browser/product.*'
      - 'src/v2/vm/check/browser/prepared-*'
      - 'src/v2/vm/check/browser/legacy-retention.*'
      - 'src/v2/vm/check/browser/restart-authority.*'
      - 'src/v2/vm/check/browser/prepared-cache-fixture/**'
      - 'src/v2/Makefile'
      - 'data/oracle/check-site-hardlinks.mjs'
      - 'data/oracle/check-persistent-block*.mjs'
      - 'data/oracle/check-native-producer-dhcp.sh'
      - 'data/oracle/seed-image.mjs'
      - 'data/oracle/network-host-linux.go'
      - 'data/oracle/check-machine-devices-close.mjs'
      - 'data/oracle/check-machine-network-reconnect.mjs'
      - 'data/oracle/check-service-observation.mjs'
      - 'data/oracle/check-memory-budget.mjs'
      - 'data/oracle/check-machine-yield.mjs'
      - 'data/oracle/check-console-readiness.mjs'
      - 'data/oracle/check-browser-storage-failure-receipt*.mjs'
      - 'data/oracle/inspect-dhcp-printf-table.mjs'
      - 'data/oracle/check-readiness-mounts.mjs'
      - 'data/distribution/boot/ready'
      - 'data/distribution/boot/boot'
      - 'data/distribution/*package-payload.sh'
      - 'data/distribution/package-recipes.sh'
      - 'data/distribution/*normalize-initramfs.py'
      - 'data/distribution/*package-set*.sh'
      - 'data/distribution/*native-bundle*'
      - 'data/distribution/*producer*'
      - 'data/distribution/optimize-payload.sh'
      - 'data/distribution/check-postlink-toolchain.sh'
      - 'data/build.sh'
      - 'src/v2/artifact/**'
      - 'src/v2/support/**'
      - 'src/v2/vm/check/browser/evidence/2026-10-12-dhcp-syslog-root-cause.json'
      - 'src/v2/vm/check/browser/evidence/2026-10-12-storage-failures-browser.json'
  pull_request:
    paths:
      - '.github/workflows/runtime-adapters.yml'
      - 'src/v2/web/**'
      - 'src/v2/vm/check/browser/storage-failures*'
      - 'src/v2/vm/check/browser/candidate-*'
      - 'src/v2/vm/check/browser/product.*'
      - 'src/v2/vm/check/browser/prepared-*'
      - 'src/v2/vm/check/browser/legacy-retention.*'
      - 'src/v2/vm/check/browser/restart-authority.*'
      - 'src/v2/vm/check/browser/prepared-cache-fixture/**'
      - 'src/v2/Makefile'
      - 'data/oracle/check-site-hardlinks.mjs'
      - 'data/oracle/check-persistent-block*.mjs'
      - 'data/oracle/check-native-producer-dhcp.sh'
      - 'data/oracle/seed-image.mjs'
      - 'data/oracle/network-host-linux.go'
      - 'data/oracle/check-machine-devices-close.mjs'
      - 'data/oracle/check-machine-network-reconnect.mjs'
      - 'data/oracle/check-service-observation.mjs'
      - 'data/oracle/check-memory-budget.mjs'
      - 'data/oracle/check-machine-yield.mjs'
      - 'data/oracle/check-console-readiness.mjs'
      - 'data/oracle/check-browser-storage-failure-receipt*.mjs'
      - 'data/oracle/inspect-dhcp-printf-table.mjs'
      - 'data/oracle/check-readiness-mounts.mjs'
      - 'data/distribution/boot/ready'
      - 'data/distribution/boot/boot'
      - 'data/distribution/*package-payload.sh'
      - 'data/distribution/package-recipes.sh'
      - 'data/distribution/*normalize-initramfs.py'
      - 'data/distribution/*package-set*.sh'
      - 'data/distribution/*native-bundle*'
      - 'data/distribution/*producer*'
      - 'data/distribution/optimize-payload.sh'
      - 'data/distribution/check-postlink-toolchain.sh'
      - 'data/build.sh'
      - 'src/v2/artifact/**'
      - 'src/v2/support/**'
      - 'src/v2/vm/check/browser/evidence/2026-10-12-dhcp-syslog-root-cause.json'
      - 'src/v2/vm/check/browser/evidence/2026-10-12-storage-failures-browser.json'

permissions:
  contents: read

jobs:
  adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check isolated storage, cleanup, and memory reservation
        run: |
          node data/oracle/check-persistent-block.mjs
          node data/oracle/check-persistent-block-failures.mjs
          node data/oracle/check-persistent-block-restore.mjs
          node data/oracle/check-persistent-block-system.mjs
          node data/oracle/check-machine-devices-close.mjs
          node data/oracle/check-machine-network-reconnect.mjs
          node data/oracle/check-service-observation.mjs
          node data/oracle/check-memory-budget.mjs
          node data/oracle/check-machine-yield.mjs
          node data/oracle/check-console-readiness.mjs
          node data/oracle/check-site-hardlinks.mjs
          node data/oracle/check-browser-storage-failure-receipt-test.mjs
          node data/oracle/check-browser-storage-failure-receipt.mjs src/v2/vm/check/browser/evidence/2026-10-12-storage-failures-browser.json
          node --check src/v2/vm/check/browser/storage-failures.mjs
          node --check src/v2/vm/check/browser/storage-failures-worker.mjs
          node --check src/v2/vm/check/browser/candidate-storage.mjs
          node --check src/v2/vm/check/browser/candidate-storage-worker.mjs
          node --check src/v2/vm/check/browser/candidate-engine.mjs
          node --check src/v2/vm/check/browser/candidate-engine-worker.mjs
          node --check src/v2/vm/check/browser/candidate-fork.mjs
          node --check src/v2/vm/check/browser/candidate-carrier.mjs
          node --check src/v2/vm/check/browser/product.mjs
          node --check src/v2/web/workspace-authority.mjs
          node --check src/v2/web/prepared-release.mjs
          node --check src/v2/web/workspace-release.mjs
          node --check src/v2/web/linux-worker.js
          node --check src/v2/web/linux-terminal.js
          node --check src/v2/vm/check/browser/prepared-release.mjs
          node --check src/v2/vm/check/browser/workspace-recovery.mjs
          node --check src/v2/vm/check/browser/legacy-retention.mjs
          node --check src/v2/vm/check/browser/restart-authority.mjs
          node --check data/oracle/seed-image.mjs
          bash -n data/oracle/check-native-producer-dhcp.sh
          node --check data/oracle/inspect-dhcp-printf-table.mjs
          bash -n data/distribution/boot/ready
          bash -n data/distribution/boot/boot
          node data/oracle/check-readiness-mounts.mjs
      - name: Check package-set input cuts and reuse
        run: |
          make -C src/v2/artifact -j2 all namespace-check namespace-xattrs-check
          sudo bash data/distribution/check-package-set-content.sh
          bash data/distribution/check-package-payload.sh
          bash data/distribution/check-service-sources-fixture.sh
          python3 data/distribution/check-normalize-initramfs.py
      - name: Check native acceptance artifact and policy binding
        run: |
          sudo python3 data/distribution/check-native-bundle-acceptance.py --require-capture
          sudo python3 data/distribution/check-producer-execution.py --require-native
          python3 data/distribution/check-producer-binding.py
          bash -n data/distribution/build-producer-cut.sh data/distribution/producer-run.sh data/distribution/optimize-payload.sh data/distribution/check-postlink-toolchain.sh data/build.sh
