[package]
name = "ricebox"
version = "0.1.0"
description = "ricebox where it is used: a root on a device, and a root run in a box"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A release's bundle is zstd frames of a tar; another distribution's root comes as a .tar.gz.
ruzstd = "0.9"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.11"

# A file made beneath the tree and through no link is the kernel's to hold (openat2), asked through a safe interface.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "fs", "net", "process", "termios"] }
# The calls no safe interface says (run.rs): a signal's handler, a child that ends with its parent, a wait for any child.
libc = "0.2"
