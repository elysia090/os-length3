[package]
name = "sods-linux"
version = "0.1.0"
edition = "2021"
publish = false
description = "Linux execution-domain authority for sods"

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Explicitly synthetic raw-ABI test artifact. The production host refuses its
# sentinel before instantiation; never install it as a selected caller artifact.
sendfile-probe = []
# Internal sealed-owner/queue diagnostics, rejected by the same host marker.
queued-output-probe = ["sendfile-probe"]
# Stronger explicit Worker and owned-sink witness, never production host IO.
queued-worker-probe = ["queued-output-probe"]
# Separate non-probe provenance/ownership candidate; no enabled capture startup.
capture-v1 = []

[dependencies]
sods-file-store = { path = "../file-store", default-features = false }
