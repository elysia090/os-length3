[package]
name = "sods-file-store"
version = "0.1.0"
edition = "2021"
publish = false
description = "Owned regular-file payloads and read leases for sods"

[workspace]

[lib]
crate-type = ["rlib", "cdylib"]

# Standalone hosts keep the existing ABI. A Rust semantic owner embeds only the
# payload library, without a second global store or extra files_* exports.
[features]
default = ["wasm-abi"]
wasm-abi = []
