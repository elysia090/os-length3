[package]
name = "sods"
version = "0.1.0"
edition = "2021"
description = "Ahead-of-time translation of static x86-64 Linux ELF programs to WebAssembly"
publish = false

# A unit of its own, with its own lock: not a member of the workspace above it (the OS's, at the top).
[workspace]

[dependencies]
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info", "gas"] }
wasm-encoder = "0.263"
# Decodes the browser root's packs (zstd), where a system call must have the bytes at once.
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
# Checks what is read from those packs against their tables (ricebox's layers/table.ts), as at once; and a
# translation's identity (src/identity.rs).
sha2 = { version = "0.11", default-features = false }

[dev-dependencies]
wasmparser = "0.263"

[profile.release]
debug = 1
# One unit, optimized across crates: the translator runs in every browser (about 9% faster there, 7% smaller).
lto = "fat"
codegen-units = 1

[lib]
crate-type = ["rlib", "cdylib"]

# The cache's checks beside the unit's others (test/), not in a folder of cargo's own naming.
[[test]]
name = "cache"
path = "test/cache.rs"
