# tmux as the root has it. A person's ~/.tmux.conf (a dotfile, from Home) comes after and wins.
# The mouse selects panes and windows, resizes and scrolls.
set -g mouse on
# Escape reaches the program at once (an editor's Escape is not taken for Meta).
set -g escape-time 10
# A long build's output kept to scroll back through.
set -g history-limit 50000
# The outer terminal's 24-bit colour passed on to what runs inside, where it has it.
set -as terminal-features ',xterm*:RGB,ghostty:RGB,alacritty:RGB,foot:RGB,wezterm:RGB'
# Programs inside are told when their pane gains and loses focus (an editor reloading a changed file).
set -g focus-events on
# What a program inside puts on the clipboard (clip, an editor's yank; OSC 52) goes on to the outer terminal's.
set -g set-clipboard on
# Window numbers close up when one is closed.
set -g renumber-windows on
