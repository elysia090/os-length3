[package]
name = "length3-core"
version = "0.1.0"
description = "What Length³ OS means by a repo, a file, an issue and a TODO; shared by the app and l3"
edition = "2021"
publish = false

[dependencies]
base64 = "0.23"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ruzstd = "0.9"
# Other distributions publish their roots as .tar.gz (Ubuntu base, Debian's official images).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.11"

# The network as a host reaches it (net.rs). Built for the web (wasm32-wasip1) the core asks the page
# that runs it instead, so none of this is in it.
[target.'cfg(not(target_os = "wasi"))'.dependencies]
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider"] }
# The host's trusted certificates beside the bundled ones (net.rs): what the
# person's machine trusts (its store, or SSL_CERT_FILE), the Remote is reached through.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-root-certs = "1.0"
rustls-native-certs = "0.8"
# This device's secrets in its OS's own keyring (vault.rs): keyring-core, and each OS's store of it.
keyring-core = "1.0.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1.1.0", default-features = false }

# The Secret Service over D-Bus from Rust alone (zbus, and its crypto in Rust): the static l3 reaches it as the app does.
[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-async-io-crypto-rust"] }
