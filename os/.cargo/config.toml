# l3 also runs inside the app's Prompt, translated by xlat, which takes static,
# non-PIE x86-64 ELFs that keep their relocations.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=+crt-static", "-C", "relocation-model=static",
  "-C", "link-arg=-no-pie", "-C", "link-arg=-Wl,--emit-relocs"]
