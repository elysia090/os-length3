# One workspace for the app, the l3 command and the core they share, so the
# app and the command can never disagree about what a repo or an issue is.
[workspace]
members = ["core", "core/web", "cli", "src-tauri"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# The core as a browser runs it (core/web, scripts/core-wasm.ts): every browser fetches it before the app can draw
# anything, so it is built small over fast: 12% fewer bytes to fetch than at "s", and its work (files written, read,
# a repo's changes and diff) measured no slower.
[profile.web]
inherits = "release"
opt-level = "z"

# l3 for the Prompt: a full strip would drop the relocations xlat reads; debug info can go.
[profile.prompt]
inherits = "release"
strip = "debuginfo"
