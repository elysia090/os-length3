# The Remote and the web app, as one Worker on one origin: accounts (Better
# Auth), the canonical copy of repos and settings (Postgres on Neon), file
# contents and release bundles (R2), and the app's own files (static assets,
# built with VITE_LENGTH3_REMOTE="" so it talks to the origin it came from).
#
# Built and shipped by Cloudflare's Workers Builds on each push to main
# (root directory os/; README.md, Deploy): the build takes the Prompt from
# the release RELEASE names and builds the app (npm run build:cloudflare),
# and service/deploy.ts runs the migrations, makes the bucket, deploys the
# Worker with the secrets it lacks (DATABASE_URL, BETTER_AUTH_SECRET,
# ENTER_KEY), and puts in the bucket the release files this tree pins that it
# lacks (the roots, the desktop app: service/mirror.ts).
name = "os-length3"
main = "service/worker.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[assets]
# The build (npm run build:cloudflare; vite.config.ts builds into this directory, and Tauri takes the app's from
# it), never this tree: served from os/ itself, the page asks for /src/main.ts, which no browser runs, and shows
# nothing but its background. service/deploy.ts refuses a directory that is not a build.
directory = "dist"
# A page of the app that is not a file is the app; the Remote's own paths always reach the Worker (and, in
# development, vite.config.ts passes the same paths to the Remote it is given).
not_found_handling = "single-page-application"
run_worker_first = ["/v1/*", "/api/*", "/.well-known/*"]

[vars]
# The URL handed on: the app and the Remote are both here. The same name is the page's (src/policy.ts
# DEFAULT_REMOTE), the core's (core/src/remote/mod.rs DEFAULT_URL) and the desktop app's policy
# (src-tauri/tauri.conf.json); service/config.test.ts holds them to these.
BASE_URL = "https://os.length3.com"
APP_ORIGIN = "https://os.length3.com"
DOMAIN = "length3.com"
# The desktop app's webview (tauri:// on Linux and macOS; a Windows build would be https://tauri.localhost,
# tauri.conf.json useHttpsScheme: never plain http, which any local process on port 80 could serve).
APP_ORIGINS = "tauri://localhost"
# For research (enter.ts): the one account. Nobody signs up; the link …/#enter=ENTER_KEY is the way
# in, and nothing is shown to everyone. Without it, the providers whose secrets are set are offered.
ENTER_AS = "banana000000"
# What the one account may keep (blobs and trees), in MB.
QUOTA_MB = "1024"
# What R2 and Neon may be asked for, counted before either is asked (service/budget.ts), within what each gives
# free: the bytes R2 holds (blobs and release files, the deploy's included), its puts and its gets and heads in
# a month, what one account uploads in a day, and the database's size, past which it takes nothing new.
R2_STORED_MB = "8192"
R2_WRITES_MONTH = "900000"
R2_READS_MONTH = "9000000"
UPLOAD_MB_DAY = "512"
PG_MB = "450"
# The plan (service/plan.ts), on a Remote that is not for research: a free account keeps 3 repos and
# 100 MB on the Remote unless these say otherwise; a failed payment stays paid 14 days.
# FREE_REPOS = "3"
# FREE_MB = "100"
# GRACE_DAYS = "14"
# Stripe: the price a subscription is to. Its keys are secrets (wrangler secret put STRIPE_SECRET_KEY,
# STRIPE_WEBHOOK_SECRET); with any of the three missing, billing is off.
# STRIPE_PRICE = "price_…"

# How often one session (or, signed out, one address) may ask, counted at the edge before the database or R2 is
# asked anything (service/app.ts): 600 a minute, a Prompt's root fetched a megabyte at a time included.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = {limit = 600, period = 60}

# What was held long enough goes, once a day (sweep.ts; worker.ts scheduled()).
[triggers]
crons = ["41 4 * * *"]

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "length3-blobs"

# The one name: the app's origin, the Remote the desktop app and l3 reach, what a domain's
# record names (remote=os.length3.com), and the passkeys' (APP_ORIGIN).
[[routes]]
pattern = "os.length3.com"
custom_domain = true

# The name the Remote had before, kept on the same Worker so the releases that reach it by
# it (0.4.x) keep working. Nothing names it any more; a newer client that finds it kept takes
# the one name instead (core/src/remote.rs current_url).
[[routes]]
pattern = "remote.length3.com"
custom_domain = true
