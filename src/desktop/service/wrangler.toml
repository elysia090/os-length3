# The Remote: accounts (Better Auth, passkeys), the canonical copy of repos
# and settings (Postgres on Neon), and file contents and release bundles (R2).
#
#   npx wrangler r2 bucket create length3-blobs
#   DATABASE_URL=… npx drizzle-kit migrate --config service/drizzle.config.ts
#   npx wrangler secret put DATABASE_URL -c service/wrangler.toml
#   npx wrangler secret put BETTER_AUTH_SECRET -c service/wrangler.toml
#   (optional) GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET; GOOGLE_…; APPLE_CLIENT_ID, APPLE_CLIENT_SECRET
#   npx wrangler deploy -c service/wrangler.toml
name = "length3-remote"
main = "worker.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
BASE_URL = "https://remote.length3.com"
# Passkeys are made and used on the web app's own origin.
APP_ORIGIN = "https://os.length3.com"
DOMAIN = "length3.com"
# The desktop app's webview (tauri:// on macOS and Linux, http://tauri.localhost on Windows).
APP_ORIGINS = "tauri://localhost http://tauri.localhost"

# What was held long enough goes, once a day (sweep.ts; worker.ts scheduled()).
[triggers]
crons = ["41 4 * * *"]

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "length3-blobs"

[[routes]]
pattern = "remote.length3.com"
custom_domain = true
