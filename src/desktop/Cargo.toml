# One workspace for the app, the l3 command and the core they share, so the
# app and the command can never disagree about what a repo or an issue is.
[workspace]
members = ["core", "cli", "src-tauri"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# l3 for the Prompt: a full strip would drop the relocations xlat reads; debug info can go.
[profile.prompt]
inherits = "release"
strip = "debuginfo"
