# The Remote: where the canonical copy of repos and settings lives
# (remote/remote.ts). Apart from the release delivery Worker at the
# repository root.
#
#   npx wrangler r2 bucket create length3-remote
#   npx wrangler deploy -c remote/wrangler.toml
name = "length3-remote"
main = "worker.ts"
compatibility_date = "2026-08-01"

[vars]
# Pages that may call it; space separated.
# The web app, and the desktop app's webview (tauri:// on macOS and Linux, http://tauri.localhost on Windows).
APP_ORIGINS = "https://os.length3.com tauri://localhost http://tauri.localhost"

[[r2_buckets]]
binding = "REMOTE"
bucket_name = "length3-remote"

[[routes]]
pattern = "remote.length3.com"
custom_domain = true
