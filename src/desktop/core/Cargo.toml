[package]
name = "length3-core"
version = "0.1.0"
description = "What Length³ OS means by a repo, a file, an issue and a TODO; shared by the app and l3"
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ruzstd = "0.9"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
