<!doctype html><meta charset="utf-8"><title>Linux product Worker verification</title>
<link rel="stylesheet" href="./startup.css">
<h1>Linux product Worker</h1><p>Same production Worker and Linux boot, no rescue shell or substitute filesystem.</p>
<form id="boot"><label>Release URL <input id="release" size="70"></label><label>SHA-256 <input id="digest" size="70"></label><button>Cold boot</button></form>
<button id="close">Close and flush</button><button id="reopen">Reopen saved volume</button>
<button id="interrupt" hidden>Terminate test Worker without flush</button>
<span id="network-controls" hidden><button id="network-disconnect">Disconnect granted carrier</button><button id="network-reconnect">Reconnect same granted carrier</button></span>
<span id="checkpoint-controls" hidden><label>Checkpoint <input id="checkpoint-name" value="before-change"></label>
<button id="checkpoint">Retain closed workspace checkpoint</button><button id="restore-checkpoint">Restore closed workspace checkpoint</button></span>
<fieldset id="release-controls" hidden><legend>Prepared release selection · diagnostic candidates</legend>
<p>Close and flush first. The supplied release pin and data compatibility come from the Supervisor, not from the download cache.</p>
<button id="prepare-release" type="button">Prepare supplied release</button>
<label>Compatible prior release <input id="prior-release" size="70" placeholder="SHA-256, or explicit unbound"></label>
<button id="select-release" type="button">Select prepared release and retain checkpoint</button>
<button id="restore-release" type="button">Restore release and workspace checkpoint</button></fieldset>
<pre id="console" tabindex="0" aria-label="Guest terminal output"></pre><form id="input-form"><input id="input-line" size="100" aria-label="Guest terminal input"><button>Send line</button></form><pre id="result">Not started</pre>
<script type="module" src="./product.mjs"></script>
